/* Силуэт арок и минаретов — генерируется один раз */
/* Фон: пиксельный город на закате или ночью — купола, минареты, пальмы, фонари, набережная.
   Рисуется один раз на canvas 195×422 (1 пиксель = 2 px экрана) и растягивается без сглаживания. */
function buildSkyline(){
  const W=195, H=422;
  if(!$('#skyline canvas')) $('#skyline').innerHTML='<canvas></canvas>';
  const cv=$('#skyline canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  const t=document.body.dataset.time||'dusk';
  const T={
    day:  {sky:['#2a6f9c','#b9d9e3'], far:'#6f9fb8', near:'#24556f', glow:'#fff1c2', stars:false, lamp:false},
    dusk: {sky:['#161033','#d07a3c'], far:'#8a5278', near:'#3a1c42', glow:'#ffd98a', stars:true,  lamp:true},
    night:{sky:['#03060d','#1c2d55'], far:'#22406e', near:'#0c1a33', glow:'#e6eeff', stars:true,  lamp:true},
  }[t];
  let seed=23; const rr=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  /* небо */
  const sg=c.createLinearGradient(0,0,0,H*.62); sg.addColorStop(0,T.sky[0]); sg.addColorStop(1,T.sky[1]);
  c.fillStyle=sg; c.fillRect(0,0,W,H);
  if(T.stars){ c.fillStyle='#ffffff'; for(let i=0;i<70;i++){ c.globalAlpha=.25+rr()*.7; c.fillRect(Math.floor(rr()*W),Math.floor(rr()*H*.4),1,1); } c.globalAlpha=1; }
  /* луна или солнце с ореолом */
  const hg=c.createRadialGradient(150,60,0,150,60,30); hg.addColorStop(0,T.glow); hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg; c.fillRect(120,30,60,60);
  c.fillStyle=T.glow; c.beginPath(); c.arc(150,60,7,0,Math.PI*2); c.fill();
  /* городской слой: блоки, купола и минареты */
  const layer=(base,col,s,dens)=>{
    c.fillStyle=col;
    for(let x=-8;x<W+8;){
      const w=Math.round((12+rr()*16)*s), h=Math.round((10+rr()*18)*s), k=rr();
      c.fillRect(x,base-h,w,H-base+h);
      if(k<dens){ c.beginPath(); c.arc(x+w/2,base-h,w*.5,Math.PI,0); c.fill(); }
      else if(k<dens+.18){ const mx=x+w-3, mh=h+Math.round(20*s); c.fillRect(mx,base-mh,3,mh); c.beginPath(); c.moveTo(mx-1,base-mh+1); c.lineTo(mx+1.5,base-mh-9*s); c.lineTo(mx+4,base-mh+1); c.fill(); }
      x+=w-2;
    }
  };
  layer(246,T.far,1,.35);
  layer(290,T.near,1.25,.4);
  /* окна и фонари на ближнем слое */
  if(T.lamp){
    for(let i=0;i<120;i++){ c.fillStyle=rr()<.7?'#ffc857':'#ffe9a8'; c.globalAlpha=.6+rr()*.4; c.fillRect(Math.floor(rr()*W),276+Math.floor(rr()*34),2,2); }
    c.globalAlpha=1;
  }
  /* набережная и отражение огней */
  const gg=c.createLinearGradient(0,312,0,H); gg.addColorStop(0,T.near); gg.addColorStop(1,'#02060c');
  c.fillStyle=gg; c.fillRect(0,312,W,H-312);
  c.fillStyle=T.far; c.globalAlpha=.25;
  for(let y=312;y<H;y+=8) c.fillRect(0,y,W,1);
  c.globalAlpha=1;
  /* пальмы по краям */
  const palm=(x,base,h,lean,col)=>{
    c.strokeStyle=col; c.lineCap='round'; c.lineWidth=3;
    const tx=x+lean, ty=base-h;
    c.beginPath(); c.moveTo(x,base); c.quadraticCurveTo(x+lean*.1,base-h*.55,tx,ty); c.stroke();
    c.lineWidth=2.5;
    [-2.9,-2.3,-1.7,-1.1,-.5,.3,1.0,1.7,2.4].forEach(a=>{ const L=13+rr()*7; c.beginPath(); c.moveTo(tx,ty); c.quadraticCurveTo(tx+Math.cos(a)*L*.55,ty+Math.sin(a)*L*.55-5,tx+Math.cos(a)*L,ty+Math.sin(a)*L*.5+5); c.stroke(); });
  };
  palm(10,336,118,14,'#041a14'); palm(22,344,84,-6,'#06241b');
  palm(186,334,120,-14,'#041a14'); palm(174,342,80,8,'#06241b');
  /* фонари на столбах */
  if(T.lamp){
    [[46,262],[98,268],[150,262]].forEach(([x,y])=>{
      c.fillStyle='#1a1408'; c.fillRect(x,y,1,20);
      const rg=c.createRadialGradient(x,y,0,x,y,18); rg.addColorStop(0,'rgba(255,200,90,.75)'); rg.addColorStop(1,'rgba(255,200,90,0)');
      c.fillStyle=rg; c.fillRect(x-18,y-18,36,36);
      c.fillStyle='#ffd27a'; c.fillRect(x-1,y-2,3,3);
    });
  }
  /* мягкая тень у низа, чтобы карты и текст читались */
  const vg=c.createLinearGradient(0,H*.55,0,H); vg.addColorStop(0,'rgba(4,17,31,0)'); vg.addColorStop(1,'rgba(4,17,31,.55)');
  c.fillStyle=vg; c.fillRect(0,H*.55,W,H*.45);
}

// Цифры урона/лечения, тряска и звук по разнице здоровья с прошлым отображением
function spawnFloat(el,text,color){
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');
  d.className='float'; d.textContent=text; d.style.color=color;
  d.style.left=(r.left+r.width/2)+'px'; d.style.top=(r.top+r.height/3)+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),950*(SPEEDS[SET.speed]||1));
}
function hitFx(el,oldV,newV){
  const d=newV-oldV;
  spawnFloat(el,(d>0?'+':'')+d,d>0?'#7cff9b':'#ff6b6b');
  if(d<0){
    el.classList.remove('shake','hitflash'); void el.offsetWidth; // перезапуск анимации при каждом ударе
    el.classList.add('shake','hitflash');
    sfx(Math.abs(d)>=5?'big':'hit');
    if(Math.abs(d)>=5) quake();
  } else sfx('heal');
}
function animateDiffs(){
  for(const side of ['p','a']){
    G[side].board.forEach(m=>{
      const old=prevHp.get(m.uid);
      const el=document.querySelector(`#${side==='p'?'pBoard':'aBoard'} [data-uid="${m.uid}"]`);
      if(el&&old!==undefined&&old!==m.hp) hitFx(el,old,m.hp);
      prevHp.set(m.uid,m.hp);
    });
    const oh=prevHero[side], nh=G[side].hero;
    if(oh!==null&&oh!==nh) hitFx($(side==='p'?'#pFrame':'#aFrame'),oh,nh);
    prevHero[side]=nh;
    const oa=prevArmor[side], na=G[side].armor||0;
    if(oa!==null&&na!==oa){
      const ae=$(side==='p'?'#pAR':'#aAR');
      if(na<oa){ armorCrack[side]=na>0; ae.classList.remove('shake'); void ae.offsetWidth; ae.classList.add('shake'); sfx('hit'); }
      else armorCrack[side]=false;
    }
    prevArmor[side]=na;
  }
}

async function playCard(i){
  if(G.busy||G.over||G.turn!=='p'||G.pend) return;
  const c=G.p.hand[i];
  G.powerSel=false;
  if(G.sel===i){ G.sel=null; return render(); }
  if(c.cost>G.p.mana) return;
  if(c.type==='minion'){
    if(G.p.board.length>=MAX_BOARD) return;
    G.p.hand.splice(i,1); G.p.mana-=c.cost;
    synergy(G.p,c);
    placeMinion(G.p,c);
    G.busy=true; render();
    await runEffect(G.p,G.a,c.bc,c,c.name);
    G.busy=false;
  } else if(TGT[c.eff]){
    G.p.hand.splice(i,1); G.p.mana-=c.cost;
    G.pend={card:c,idx:i}; G.sel=null; G.atk=null;
    return render();
  } else {
    G.p.hand.splice(i,1); G.p.mana-=c.cost;
    G.busy=true; render();
    sfx('spell'); spellFx(c.tag);
    await runEffect(G.p,G.a,c);
    G.busy=false;
  }
  G.sel=null;
  settle(); checkOver(); render();
}

function onTarget(side,t){
  if(G.busy||G.over||G.turn!=='p') return;
  const me=G.p, foe=G.a;

  if(G.powerSel){
    if(canTarget(POWERS[S.power].eff,side,t)) applyPower(t);
    return;
  }
  if(G.pend){ resolvePend(side,t); return; }

  if(G.sel!==null){
    const c=me.hand[G.sel];
    if(!canTarget(c.eff,side,t)) return;
    me.hand.splice(G.sel,1); me.mana-=c.cost; G.sel=null;
    sfx('spell'); spellFx(c.tag);
    castSpell(me,foe,c,t);
    settle(); checkOver(); return render();
  }

  if(side==='p'){
    if(t==='hero'||!(t.atks>0&&t.atk>0)) return;
    G.atk=G.atk===t.uid?null:t.uid;
    return render();
  }

  if(G.atk==null) return;
  const att=me.board.find(m=>m.uid===G.atk);
  if(!att){ G.atk=null; return render(); }
  const taunts=foe.board.filter(m=>m.taunt);
  if(t==='hero'){
    if(taunts.length||att.noHero) return;
    G.busy=true;
    const from=document.querySelector(`#pBoard [data-uid="${att.uid}"]`);
    flyTo(from,$('#aCard'),'#ffc857').then(()=>{
      G.busy=false;
      dealHero(foe,att.atk);
      if(att.lifesteal) heal(me,att.atk);
      att.atks--; att.stealth=false; G.atk=null;
      G.lunge=att.uid;
      settle(); checkOver(); render();
    });
    return;
  } else {
    if(t.stealth) return;
    if(taunts.length&&!t.taunt) return;
    combat(att,t,me);
  }
  att.atks--; att.stealth=false; G.atk=null;
  G.lunge=att.uid;
  settle(); checkOver(); render();
}

/* ---------- Перетаскивание: из руки на поле, существа тянутся на цель ----------
   Тап без движения ничего не разыгрывает: существо выбирает атаку, приём выбирает цель. */
let handDragged=false;
const NONE={kind:'none',el:null};
function bindDrag(el,o){
  let start=null, drag=null;
  el.addEventListener('pointerdown',e=>{ handDragged=false; start={x:e.clientX,y:e.clientY,id:e.pointerId}; });
  el.addEventListener('pointermove',e=>{
    if(!start||start.id!==e.pointerId) return;
    if(!drag){
      const dx=e.clientX-start.x, dy=e.clientY-start.y;
      if(Math.hypot(dx,dy)<10) return;
      if(o.horizontalPass&&dy>-10&&Math.abs(dx)>Math.abs(dy)){ start=null; return; }  /* горизонталь — прокрутка руки */
      drag=o.begin(e);
      if(!drag){ start=null; return; }
      handDragged=true;
    }
    o.move(drag,e);
  });
  el.addEventListener('pointerup',e=>{
    if(!start||start.id!==e.pointerId) return;
    const d=drag; start=null; drag=null;
    if(d) o.end(d,e);
  });
  el.addEventListener('pointercancel',()=>{ if(drag) o.cancel(drag); start=null; drag=null; });
}
function makeGhost(el,e,scale){
  const g=el.cloneNode(true);
  g.classList.add('ghostDrag');
  g.classList.remove('sel','dim','ready','deal','enter','lunge','target','dragSrc');
  g.removeAttribute('data-uid');
  if(scale) g.style.transform=`translate(-50%,-70%) scale(${scale})`;
  document.body.appendChild(g);
  el.classList.add('dragSrc');
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  return g;
}
function dragMove(d,e){
  d.ghost.style.left=e.clientX+'px'; d.ghost.style.top=e.clientY+'px';
  const z=d.zone(e.clientX,e.clientY);
  if(d.hi&&d.hi!==z.el) d.hi.classList.remove('dropHi');
  if(z.el) z.el.classList.add('dropHi');
  d.hi=z.el||null;
}
function dragCancel(d){
  d.ghost.remove(); d.el.classList.remove('dragSrc');
  if(d.hi) d.hi.classList.remove('dropHi');
  d.hi=null;
}
function dragEnd(d,e){ const z=d.zone(e.clientX,e.clientY); dragCancel(d); return z; }

/* Карта из руки: существо — на поле, заклинание — на поле (затем выбор цели) */
function handZone(x,y,i){
  const c=G.p&&G.p.hand[i];
  if(!c||G.busy||G.over||G.turn!=='p'||G.pend||c.cost>G.p.mana) return NONE;
  if(c.type==='minion'){
    if(G.p.board.length>=MAX_BOARD) return NONE;
    const r=$('#pBoard').getBoundingClientRect();
    return (y>r.top-30&&y<r.bottom+30)?{kind:'board',el:$('#pBoard')}:NONE;
  }
  const hr=$('#pHand').getBoundingClientRect();
  return y<hr.top-10?{kind:'board',el:null}:NONE;
}
function bindHandCard(el,i){
  bindDrag(el,{
    horizontalPass:true,
    begin:e=>{ const d={el,ghost:makeGhost(el,e),hi:null,zone:(x,y)=>handZone(x,y,i)}; dragMove(d,e); return d; },
    move:(d,e)=>dragMove(d,e),
    end:(d,e)=>{ const z=dragEnd(d,e); if(z.kind==='board') playCard(i); },
    cancel:d=>dragCancel(d)
  });
  el.onclick=()=>{ if(handDragged){ handDragged=false; return; } tapHand(i); };
}
function tapHand(i){
  if(!G.p||G.busy||G.over||G.turn!=='p') return;
  const c=G.p.hand[i];
  if(c.type==='spell'&&TGT[c.eff]) return playCard(i);
  G.note=c.cost>G.p.mana?'Маны не хватает':'Тяните карту на поле';
  render();
}

/* Существо на поле: можно тянуть на врага-героя или на существо врага, если оно может атаковать */
function canAttackWith(m,t){
  if(!G.p.board.includes(m)||!(m.atks>0&&m.atk>0)) return false;
  const taunts=G.a.board.some(x=>x.taunt);
  if(t==='hero') return !taunts&&!m.noHero;
  if(t.stealth) return false;
  return !taunts||!!t.taunt;
}
function attackZone(x,y,m){
  const el=document.elementFromPoint(x,y);
  if(!el||G.busy||G.over||G.turn!=='p') return NONE;
  if(el.closest('#aCard')) return canAttackWith(m,'hero')?{kind:'target',t:'hero',el:$('#aCard')}:NONE;
  const card=el.closest('#aBoard .card');
  if(card&&card.dataset.uid){
    const t=G.a.board.find(x=>x.uid===+card.dataset.uid);
    if(t&&canAttackWith(m,t)) return {kind:'target',t,el:card};
  }
  return NONE;
}
function bindBoardMinion(el,m){
  bindDrag(el,{
    begin:e=>{
      if(!(G.turn==='p'&&!G.busy&&!G.over&&!G.pend&&m.atks>0&&m.atk>0)) return null;
      const d={el,ghost:makeGhost(el,e,1.15),hi:null,zone:(x,y)=>attackZone(x,y,m)};
      dragMove(d,e); return d;
    },
    move:(d,e)=>dragMove(d,e),
    end:(d,e)=>{
      const z=dragEnd(d,e);
      if(z.kind!=='target') return;
      G.atk=m.uid; onTarget('a',z.t);
      if(G.atk===m.uid&&!G.busy){ G.atk=null; render(); }
    },
    cancel:d=>dragCancel(d)
  });
}

/* Приём с целью: карта уже разыграна, теперь выбираем цель; отмена возвращает карту и ману */
function resolvePend(side,t){
  const c=G.pend.card;
  if(!canTarget(c.eff,side,t)) return;
  G.pend=null;
  sfx('spell'); spellFx(c.tag);
  castSpell(G.p,G.a,c,t);
  settle(); checkOver(); render();
}
function cancelPend(){
  if(!G.pend||G.busy) return;
  const {card,idx}=G.pend;
  G.p.hand.splice(Math.min(idx,G.p.hand.length),0,card);
  G.p.mana+=card.cost; G.pend=null;
  sfx('click'); render();
}

async function endTurn(){
  if(G.turn!=='p'||G.busy||G.over||G.pend) return;
  sfx('click');
  G.turn='a'; G.sel=null; G.atk=null; G.note=''; G.powerSel=false;
  render();
  await aiTurn(false);
}

/* ---------- Ход ИИ ---------- */
async function aiPlay(i){
  const a=G.a,p=G.p,c=a.hand[i];
  if(c.type==='minion'){
    if(a.board.length>=MAX_BOARD) return false;
    a.hand.splice(i,1); a.mana-=c.cost;
    synergy(a,c);
    placeMinion(a,c);
    await runEffect(a,p,c.bc,c,c.name);
    return true;
  }
  if(c.eff==='coin'){
    if(!a.hand.some(h=>h.cost>a.mana&&h.cost<=a.mana+1)) return false;
    a.hand.splice(i,1); castSpell(a,p,c,null);
    return true;
  }
  let t=null;
  switch(c.eff){
    case 'dmg': {
      if(p.hero<=c.val) t='hero';
      else { const q=p.board.filter(m=>!m.stealth&&m.hp<=c.val).sort((x,y)=>y.atk-x.atk)[0]; if(q) t=q; }
      if(t===null) return false;
      break;
    }
    case 'silence': {
      const q=p.board.filter(m=>!m.stealth&&hasKw(m)).sort((x,y)=>y.atk-x.atk)[0];
      if(!q) return false;
      t=q; break;
    }
    case 'heal': if(a.hero>=MAX_HP-6) return false; break;
    case 'buff': {
      const q=a.board.slice().sort((x,y)=>y.atk-x.atk)[0];
      if(!q) return false;
      t=q; break;
    }
    case 'aoe': if(p.board.length<2&&!p.board.some(m=>m.hp<=c.val)) return false; break;
    case 'kill': {
      const q=p.board.filter(m=>!m.stealth).sort((x,y)=>(y.atk+y.hp)-(x.atk+x.hp))[0];
      if(!q) return false;
      t=q; break;
    }
    case 'mheal': {
      const q=a.board.slice().sort((x,y)=>x.hp-y.hp)[0];
      if(!q) return false;
      t=q; break;
    }
    case 'freeze': {
      const q=p.board.filter(m=>!m.stealth&&!m.frozen).sort((x,y)=>y.atk-x.atk)[0];
      if(!q) return false;
      t=q; break;
    }
    case 'freezeAll': if(!p.board.some(m=>!m.frozen)) return false; break;
    case 'summon': if(a.board.length>=MAX_BOARD) return false; break;
    case 'ramp': if(a.max>=MAX_MANA) return false; break;
  }
  a.hand.splice(i,1); a.mana-=c.cost;
  sfx('spell'); spellFx(c.tag);
  await runEffect(a,p,c,t);
  return true;
}

async function aiTurn(skipDraw){
  G.busy=true;
  beginTurn(G.a,skipDraw);
  render();
  await wait(400);

  let acted=true;
  while(acted&&!checkOver()){
    acted=false;
    const order=G.a.hand.map((c,i)=>i)
      .filter(i=>G.a.hand[i].cost<=G.a.mana)
      .sort((x,y)=>G.a.hand[y].cost-G.a.hand[x].cost);
    for(const i of order){
      if(await aiPlay(i)){ acted=true; break; }
    }
    settle();
    if(acted){ render(); await wait(350); }
  }

  for(const att of [...G.a.board]){
    while(att.atks>0&&att.atk>0&&G.a.board.includes(att)&&!checkOver()){
      await wait(300);
      const taunts=G.p.board.filter(m=>m.taunt);
      const open=G.p.board.filter(m=>!m.stealth);
      let target;
      if(taunts.length){
        target=taunts.reduce((x,y)=>x.hp<=y.hp?x:y);
      } else {
        const killable=open.filter(m=>m.hp<=att.atk&&m.atk<att.hp).sort((x,y)=>y.atk-x.atk);
        if(killable.length) target=killable[0];
        else if(att.noHero) target=open.slice().sort((x,y)=>x.hp-y.hp)[0];
        else target='hero';
      }
      if(!target){ att.atks=0; break; }
      if(target==='hero'){
        await flyTo(document.querySelector(`#aBoard [data-uid="${att.uid}"]`),$('#pCard'),'#ff6b6b');
        dealHero(G.p,att.atk);
        if(att.lifesteal) heal(G.a,att.atk);
      } else combat(att,target,G.a);
      att.atks--; att.stealth=false;
      G.lunge=att.uid;
      settle(); render();
    }
  }

  G.busy=false;
  if(checkOver()) return render();
  G.turn='p';
  beginTurn(G.p,false);
  settle();
  checkOver();
  render();
}

function showSettings(){
  PHASE='settings'; setScreen('draft'); setBack(showModes);
  $('#status').textContent='Настройки';
  $('#screen').innerHTML=`
    <h2>Настройки</h2>
    <div class="modes">
      <button class="pbtn big ghost" id="sSound">ЗВУК: ${SET.sound?'ВКЛ':'ВЫКЛ'}</button>
      <button class="pbtn big ghost" id="sSpeed">СКОРОСТЬ: ${SPEED_NAME[SET.speed]}</button>
      <button class="pbtn big ghost" id="sTut">ПОКАЗАТЬ ОБУЧЕНИЕ СНОВА</button>
      <button class="pbtn big" id="sBack">НАЗАД</button>
    </div>`;
  $('#sSound').onclick=()=>{ SET.sound=!SET.sound; saveSet(); if(SET.sound) sfx('click'); showSettings(); };
  $('#sSpeed').onclick=()=>{ const order=['normal','fast','slow']; SET.speed=order[(order.indexOf(SET.speed)+1)%3]; saveSet(); applySettings(); showSettings(); };
  $('#sTut').onclick=()=>{ SET.tutDone=false; saveSet(); $('#sTut').textContent='ОБУЧЕНИЕ ВКЛЮЧИТСЯ В СЛЕДУЮЩЕЙ СЕРИИ'; };
  $('#sBack').onclick=()=>{ sfx('click'); showModes(); };
}

/* Горячие клавиши: 1–3 в драфте, Пробел или Enter завершают ход */
document.addEventListener('keydown',e=>{
  if(e.target!==document.body) return;
  if($('#relic').classList.contains('show')||$('#ask').classList.contains('show')||$('#zoom').classList.contains('show')) return;
  if($('#opts')&&D&&!$('#discover').classList.contains('show')){
    const k=parseInt(e.key,10);
    if(k>=1&&k<=D.opts.length){ pick(k-1); return; }
  }
  if(G&&$('#end')&&(e.key===' '||e.key==='Enter')&&!$('#overlay').classList.contains('show')){
    e.preventDefault(); endTurn();
  }
});
