<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071c33">
<title>АРЕНА</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--gold:#e9c46a;--gold2:#b8862b;--gold3:#ffe39a;--ink:#f5efdc;--red:#ff6b6b;--green:#7cff9b;--tur:#2fb3c9;--terra:#d9703e;--em:#2a9d7a;--night:#04111f;--cob:#14487a;--cob2:#071c33;--panel:linear-gradient(#0d2c4f,#061626);--spd:1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'VT323',monospace;font-size:19px;color:var(--ink);background:var(--night);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
#app{width:100%;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(233,196,106,.05) 0 2px,transparent 2px 14px),
             repeating-linear-gradient(90deg,rgba(233,196,106,.05) 0 2px,transparent 2px 14px),
             linear-gradient(rgba(4,17,31,.12),rgba(4,17,31,.35) 45%,rgba(4,17,31,.6))}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(#0d2c4f,#061626);border-bottom:3px solid var(--gold2);box-shadow:0 0 0 2px var(--night),0 4px 0 #000}
h1{margin:0;font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);white-space:nowrap}
#status{flex:1;min-width:0;font-size:20px;color:#b9af97;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#score{font-size:15px;line-height:1.05;color:var(--gold);white-space:nowrap;text-align:right}
.hdrBtn{visibility:hidden}
body.battle .hdrBtn{visibility:visible}
#screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:10px}
h2{font-family:'Press Start 2P',monospace;font-size:14px;line-height:1.5;color:var(--gold);text-align:center;margin:8px 0}
.sub{font-size:20px;text-align:center;color:#b9af97;margin:6px 0 12px;line-height:1.1}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.glossary{max-width:440px;margin:16px auto 0;font-size:17px;color:#b9af97;line-height:1.15;text-align:center}

/* Пиксельные кнопки и панели */
/* Кнопки в стиле резных рамок: тёмно-синяя заливка, золотой контур с внутренней линией */
.pbtn{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.4;color:var(--gold3);background:linear-gradient(#1f4b76,#0b2140);border:2px solid var(--gold2);border-radius:5px;padding:10px 12px;cursor:pointer;text-shadow:0 2px 0 #000;box-shadow:0 0 0 2px var(--night),inset 0 0 0 2px var(--night),inset 0 0 0 3px rgba(233,196,106,.45),0 5px 0 #000;transition:transform .08s,filter .08s}
.pbtn:hover:not(:disabled){filter:brightness(1.12)}
.pbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 2px var(--night),inset 0 0 0 2px var(--night),inset 0 0 0 3px rgba(233,196,106,.45),0 2px 0 #000}
.pbtn:disabled{opacity:.4;cursor:default}
.pbtn.ghost{background:linear-gradient(#0c2440,#05121f);color:var(--gold)}
/* Главное действие: золотая заливка */
#end,#next,#cont{background:linear-gradient(#ffe39a,#d9a441 60%,#a9711f);color:#241a00;text-shadow:none;border-color:#fff1c4}
.pbtn.sm{font-size:9px;padding:6px 8px}
.pbtn.big{font-size:13px;padding:18px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:300px}
.pbtn.big small{font-family:'VT323',monospace;font-size:20px;color:#b9af97;text-shadow:none}
.pbtn.big.ghost small{color:#b9af97}
.modes{display:flex;flex-direction:column;gap:16px;align-items:center;margin:14px 0}
button:focus-visible,.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* Резная панель: двойная золотая рамка и ромбы по центру верхнего и нижнего края */
.px,#tipBox,.zc,.logo{position:relative;background:var(--panel);border:3px solid var(--gold2);box-shadow:0 0 0 2px var(--night),0 0 0 4px rgba(233,196,106,.28),0 6px 0 #000}
.px::before,#tipBox::before,.zc::before,.logo::before,.logo::after,.px::after,#tipBox::after,.zc::after{content:'';position:absolute;left:50%;width:9px;height:9px;margin-left:-5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 0 2px var(--night);z-index:2}
.px::before,#tipBox::before,.zc::before,.logo::before{top:-7px}
.px::after,#tipBox::after,.zc::after,.logo::after{bottom:-7px}
.px,#tipBox,.zc,.logo{outline:1px solid rgba(233,196,106,.45);outline-offset:-7px}
.px{background:var(--panel);border:3px solid var(--gold2);box-shadow:0 0 0 2px var(--night),0 0 0 4px rgba(233,196,106,.28),0 6px 0 #000}

/* Подсказки обучения */
#tipBox{display:none;margin:8px 0 12px;padding:10px 12px}
#tipBox.show{display:block}
#tipText{font-size:19px;line-height:1.05;color:var(--ink);margin-bottom:6px}

/* Карты */
.card{position:relative;display:flex;flex-direction:column;flex-shrink:0;background:linear-gradient(#14487a,#071c33);border:3px solid var(--gold2);box-shadow:0 0 0 2px var(--night),4px 4px 0 2px rgba(0,0,0,.45);cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card.full{width:150px;height:250px}
.card.stealthy{opacity:.65}
.card canvas{width:100%;height:auto;aspect-ratio:3/2;display:block;image-rendering:pixelated;background:var(--cob2);border-bottom:2px solid var(--gold2)}
.card.divine canvas{filter:drop-shadow(0 0 3px var(--gold))}

/* Редкость: белый бриллиант, синий, фиолетовый, золотисто-оранжевый */
.card.rc{border-color:#f4f0ff;box-shadow:0 0 0 2px var(--night),0 0 9px rgba(244,240,255,.45),4px 4px 0 2px rgba(0,0,0,.45)}
.card.rr{border-color:#3d8bff;box-shadow:0 0 0 2px var(--night),0 0 10px rgba(61,139,255,.6),4px 4px 0 2px rgba(0,0,0,.45)}
.card.rm{border-color:#a45cff;box-shadow:0 0 0 2px var(--night),0 0 12px rgba(164,92,255,.65),4px 4px 0 2px rgba(0,0,0,.45)}
.card.rl{border-color:#ffb020;box-shadow:0 0 0 2px var(--night),0 0 16px rgba(255,140,40,.75),4px 4px 0 2px rgba(0,0,0,.45);animation:legShine calc(2.4s*var(--spd)) ease-in-out infinite}
@keyframes legShine{0%,100%{border-color:#ffd166}50%{border-color:#ff7a1a}}
/* Заморозка: иней поверх арта */
.frost{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;z-index:2;pointer-events:none;background:linear-gradient(rgba(159,231,255,.55),rgba(159,231,255,.18)),radial-gradient(#ffffff 1px,transparent 1.5px) 0 0/7px 7px;animation:frostIn calc(.5s*var(--spd)) ease-out both}
@keyframes frostIn{from{opacity:0;filter:brightness(2)}to{opacity:1;filter:none}}
/* Легендарная рамка: мозаика (зеллиж) по кольцу */
.mring{position:absolute;inset:0;padding:5px;pointer-events:none;z-index:4;background:repeating-conic-gradient(#ffc857 0 25%,#8a4b12 0 50%) 0 0/10px 10px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
/* Мерцание арта у мифических и легендарных карт */
.card.rm canvas,.card.rl canvas{animation:artGlow calc(3.2s*var(--spd)) ease-in-out infinite}
@keyframes artGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) saturate(1.15)}}
/* Заклинание: свиток с валиками сверху и снизу вместо рамки существа */
.card.spell{background:linear-gradient(#6a3f1c,#2b170a)}
.card.spell::before,.card.spell::after{content:'';position:absolute;left:0;right:0;height:9px;z-index:1;background:linear-gradient(#f5e6b8,#c79a52);border-radius:5px;box-shadow:0 2px 0 #3a2208}
.card.spell::before{top:0}
.card.spell::after{bottom:0}
.card.spell .name{color:#ffe7a8}
/* Фон: медленно сдвигающийся узор */
body::before{content:'';position:fixed;inset:-60px;z-index:-1;pointer-events:none;opacity:.7;background:repeating-linear-gradient(45deg,transparent 0 22px,rgba(201,169,106,.10) 22px 24px),repeating-linear-gradient(-45deg,transparent 0 22px,rgba(29,111,115,.14) 22px 24px);animation:drift calc(40s*var(--spd)) linear infinite}
@keyframes drift{to{transform:translate(24px,24px)}}
/* Мозаичный переход между экранами */
.mosaic{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(14,1fr)}
.mosaic i{display:block;animation:tileOut calc(.42s*var(--spd)) ease-in forwards;animation-delay:calc(var(--d)*var(--spd))}
@keyframes tileOut{to{transform:scale(0)}}
/* Подробности: спрятаны за кнопкой */
details.more{margin:14px auto 0;max-width:440px;text-align:center}
details.more summary{list-style:none;display:inline-block;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);background:var(--cob2);border:2px solid var(--gold2);box-shadow:0 0 0 2px var(--night);padding:7px 10px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{background:var(--gold2);color:#241a00}
details.more .glossary{margin-top:10px}
.card.frz{box-shadow:0 0 0 2px var(--night),inset 0 0 0 3px #9fe7ff,0 0 10px #9fe7ff}
/* Самоцвет редкости: по центру верхнего края карты */
/* Бриллиант стоит в потоке между артом и названием, по центру */
.gem{position:relative;align-self:center;flex-shrink:0;margin:-8px 0 -7px;width:16px;height:14px;z-index:3;clip-path:polygon(50% 0,100% 36%,78% 100%,22% 100%,0 36%);filter:drop-shadow(0 0 2px rgba(0,0,0,.85))}
.card.hand .gem,.card.board .gem{width:10px;height:9px;margin:-5px 0 -4px}
/* Кнопка «i»: открывает все ключевые слова и пояснения */
.cinfo{position:absolute;top:3px;right:3px;z-index:4;width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);background:var(--cob2);border:2px solid var(--gold2);box-shadow:0 0 0 2px var(--night);cursor:pointer}
.card.hand .cinfo{width:18px;height:18px;font-size:8px;top:2px;right:2px}
.card.board .cinfo{display:none}
.rc .gem{background:linear-gradient(120deg,#ffffff 0 35%,#d7ecff 35% 60%,#a9cdf5 60%)}
.rr .gem{background:linear-gradient(120deg,#e6f2ff 0 30%,#3d8bff 30% 62%,#1b4fa3 62%)}
.rm .gem{background:linear-gradient(120deg,#f0e0ff 0 30%,#a45cff 30% 62%,#5a2aa0 62%)}
.rl .gem{background:linear-gradient(120deg,#fff3c4 0 30%,#ffb020 30% 62%,#ff7a1a 62%)}
/* Круглая плашка стоимости: синий самоцвет в верхнем левом углу */
.cost{position:absolute;top:4px;left:4px;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:10px;color:#fff;text-shadow:0 1px 0 #03112a;background:radial-gradient(circle at 35% 28%,#b9dcff 0,#2f73d6 42%,#0d2c6b 100%);border:2px solid #eaf4ff;box-shadow:0 0 0 2px var(--night),0 2px 0 #000;z-index:5}
/* Плашка названия: тёмная полоса между рамками */
.name{font-size:16px;line-height:.95;color:var(--gold3);text-align:center;padding:4px 4px 2px;height:46px;overflow:hidden;display:block;background:linear-gradient(#0c2844,#061628);border-top:2px solid var(--gold2);border-bottom:2px solid var(--gold2)}
.text{flex:1;min-height:0;overflow:hidden;font-size:17px;line-height:1;color:#d9d0b6;text-align:center;padding:4px 6px}
/* Атака и здоровье: квадратные пиксельные плашки в нижних углах, заходят на край карты */
.stats{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px 4px;pointer-events:none;z-index:5;font-family:'Press Start 2P',monospace;font-size:11px}
.stats span{width:27px;height:27px;border-radius:0;display:flex;align-items:center;justify-content:center;line-height:1;text-shadow:0 1px 0 #000;border:2px solid var(--gold2);box-shadow:0 0 0 2px var(--night),0 2px 0 #000}
.atk{color:#ffe39a;background:radial-gradient(circle at 35% 28%,#5a4a32,#1d160b 75%)}
.hp{color:#fff;background:radial-gradient(circle at 35% 28%,#ff9a9a,#c42a2a 55%,#5a0c0c);border-color:#ffd6d6}
.card.mn .text{padding-bottom:32px}
/* Карты в руке одной высоты; тянуть вверх — играть, горизонталь — прокрутка руки */
.card.hand{width:96px;height:150px;cursor:grab;touch-action:pan-x}
.card.hand .text{display:block;flex:1 1 auto;min-height:0;overflow:hidden;font-size:12px;line-height:1;padding:3px 3px 2px;color:#d9d0b6;text-align:center}
.card.dragSrc{opacity:.25}
.ghostDrag{position:fixed;z-index:60;pointer-events:none;margin:0;transform:translate(-50%,-70%) scale(1.12);animation:none!important;transition:none!important;opacity:.95;box-shadow:0 16px 26px rgba(0,0,0,.6)!important}
.dropHi{outline:3px solid var(--green);outline-offset:4px}
/* Счётчики маны и руки рядом с кнопкой конца хода */
#counts{font-size:20px;line-height:1.05;color:#cfc6ae;text-align:right;white-space:nowrap}
#counts b{color:var(--tur);font-weight:normal}
#counts b.full{color:var(--red)}
.card.hand.mn .text{padding-bottom:24px}
.card.hand .name{font-size:12px;line-height:1;min-height:34px;height:auto;padding:4px 2px 0;overflow-wrap:anywhere}
.card.hand .cost{width:21px;height:21px;font-size:8px;top:3px;left:3px}
.card.hand .stats{padding:0 3px 3px}
.card.hand .stats span{width:21px;height:21px;font-size:8px;border-width:2px}
.card.board{width:66px;height:94px;flex:0 1 66px;min-width:0;justify-content:flex-start}
.card.board canvas{aspect-ratio:auto;height:62px;object-fit:cover}
.card.board .name,.card.board .text,.card.board .cost{display:none}
.card.board .stats{padding:0 3px 3px;font-size:9px}
.card.board .stats span{width:19px;height:19px;font-size:7px;border-width:2px}
.card.dim{opacity:.45}
.card.sel{box-shadow:0 0 0 2px var(--night),0 0 0 5px #fff,0 0 16px var(--gold)}
.card.target{box-shadow:0 0 0 2px var(--night),0 0 0 5px var(--red),0 0 14px var(--red)}
.card.ready{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--green)}
.card.repl{opacity:.5;box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--red)}
.card:hover{transform:translateY(-6px)}
.card.dim:hover,.card.board:hover{transform:none}

/* Рука: горизонтальный ряд внизу экрана */
.hand{display:flex;overflow-x:auto;overflow-y:hidden;padding:12px 10px 10px;align-items:flex-end;min-height:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hand::-webkit-scrollbar{display:none}
.hand .card{margin-right:-10px}
.hand .card:last-child{margin-right:0}
.hand .card:hover{z-index:5;transform:translateY(-10px)}

/* Поле и герои */
.battle{flex:1;width:100%;min-width:0;display:flex;flex-direction:column;min-height:0}
.side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px;min-height:0}
.field{display:flex;gap:6px;justify-content:center;align-items:center;min-height:104px;padding:4px 2px}
.heroRow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px}
.heroCard{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 6px;min-width:0}
.heroCard.target{box-shadow:0 0 0 2px var(--night),0 0 0 5px var(--red)}
.pframe{position:relative;flex:0 0 auto;width:76px;height:76px;border:3px solid var(--gold2);box-shadow:0 0 0 2px var(--night);background:var(--cob2)}
.pframe canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.pframe b{position:absolute;bottom:2px;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1;padding:3px 4px;background:rgba(7,28,51,.92);box-shadow:0 0 0 1px var(--night)}
.pframe .ohp{left:2px;color:var(--red)}
.pframe .oar{right:2px;color:#7fb8ff}
#pFrame .ohp{color:var(--green)}
.hbody{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.hero{font-size:18px;line-height:1.05;color:#cfc6ae;white-space:nowrap}
.hero{display:block;padding:0;min-width:0}
#power{font-size:8px;padding:6px 6px;line-height:1.35;white-space:nowrap}
.crystals{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.cr{width:12px;height:12px;background:#2b3a4f;box-shadow:0 0 0 2px var(--night)}
.cr.on{background:var(--tur);box-shadow:0 0 0 2px var(--night),0 0 6px var(--tur)}
.mid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-top:3px dashed var(--gold2);border-bottom:3px dashed var(--gold2);background:rgba(7,28,51,.6)}
.hint{flex:1;font-size:18px;line-height:1.05;color:var(--gold)}
#end{font-size:9px}

/* Драфт, колода, муллиган */
.draftRow{display:grid;grid-template-columns:repeat(2,clamp(130px,42vw,190px));gap:14px;justify-content:center;width:100%}
.draftRow .card{width:100%;height:auto;aspect-ratio:19/30}
.draftRow .card:nth-child(3){grid-column:1/-1;justify-self:center;width:clamp(130px,42vw,190px)}
.draftRow.quad .card:nth-child(3){grid-column:auto;justify-self:stretch;width:100%}
.deckGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;justify-items:center}
/* Карты в сетке колоды и выбора не блокируют вертикальную прокрутку пальцем */
.deckGrid .card.hand{touch-action:auto;cursor:pointer}
.curve{display:flex;gap:10px;justify-content:center;align-items:flex-end;height:100px;margin:10px 0}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;width:30px;height:100%}
.bar{width:26px;background:linear-gradient(var(--gold),#7a5b1c);color:#241a00;font-family:'Press Start 2P',monospace;font-size:8px;text-align:center;box-shadow:0 0 0 2px var(--night)}
.col small{color:#b9af97;font-size:18px}

/* Оверлеи */
#overlay,#discover,#zoom,#relic,#ask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(4,17,31,.86);z-index:15;padding:16px;text-align:center}
#overlay{background:radial-gradient(ellipse at 50% 42%,rgba(4,17,31,.84),rgba(4,17,31,.96) 75%)}
#overlay.show,#discover.show{display:flex;animation:fadeIn calc(.2s*var(--spd)) ease-out}
#discover .draftRow{max-width:420px}
/* Золотой баннер победы: градиентный текст с тенью и сияние по бокам */
#res{display:flex;align-items:center;gap:12px;font-family:'Press Start 2P',monospace;font-size:20px;line-height:1.4;color:transparent;background:linear-gradient(#fff6d2,#f2c24e 45%,#c27a1e 75%,#8a4b12);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 #3a1f05) drop-shadow(0 0 12px rgba(255,190,80,.7));text-shadow:none;margin-bottom:4px}
#res::before,#res::after{content:'';width:34px;height:4px;background:linear-gradient(90deg,transparent,#e9c46a);flex-shrink:0}
#res::after{transform:scaleX(-1)}
#sub{align-self:center;max-width:92%;font-size:24px;color:#e7dcc0;background:rgba(4,17,31,.8);padding:4px 12px;border:2px solid var(--gold2)}
#zoom{display:none;pointer-events:none;background:rgba(4,17,31,.8);z-index:40}
#zoom.show{display:flex;animation:fadeIn calc(.15s*var(--spd)) ease-out}
#zoom.sticky{pointer-events:auto}
#zoom .zc{position:relative}
#zoom .zTop{padding-right:46px}
.zX{position:absolute;top:6px;right:6px;z-index:3;width:34px;height:34px;padding:0;font-family:'Press Start 2P',monospace;font-size:14px;line-height:1;color:var(--gold);background:var(--cob2);border:2px solid var(--gold2);box-shadow:0 0 0 2px var(--night);cursor:pointer}
#relic{background:rgba(4,17,31,.92);z-index:16}
#relic.show{display:flex;animation:fadeIn calc(.2s*var(--spd)) ease-out}
#ask{background:rgba(4,17,31,.94);z-index:17}
#ask.show{display:flex;animation:fadeIn calc(.2s*var(--spd)) ease-out}
.relicList{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.pbtn.relicBtn{display:block;text-align:left;font-size:11px;padding:14px 12px;width:100%}
.pbtn.relicBtn small{display:block;font-family:'VT323',monospace;font-size:20px;color:#4a3608;margin-top:6px;line-height:1.05}
.zc{width:min(78vw,320px);background:var(--panel);border:5px solid var(--gold2);box-shadow:0 0 0 3px var(--night),0 0 0 6px rgba(233,196,106,.28),0 8px 0 3px #000;padding:0 0 12px;animation:zoomIn calc(.22s*var(--spd)) cubic-bezier(.2,.9,.3,1.2)}
.zc.rc{border-color:#f4f0ff}
.zc.rr{border-color:#3d8bff}
.zc.rm{border-color:#a45cff}
.zc.rl{border-color:#ffb020}
.zTop{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.zTop .cost{position:static;width:36px;height:36px;font-size:12px}
.zName{font-size:26px;line-height:1;color:var(--gold3);text-align:left;text-shadow:0 2px 0 #000}
/* Логотип меню: арочная резная табличка */
.logo{align-self:center;margin:6px 0 14px;padding:16px 26px 14px;text-align:center;max-width:100%}
.logo b{display:block;font-family:'Press Start 2P',monospace;font-weight:normal;font-size:28px;line-height:1.2;color:var(--gold3);letter-spacing:2px;text-shadow:0 4px 0 #6b3d0b,0 0 18px rgba(255,200,90,.45)}
.logo small{display:block;font-size:21px;line-height:1;color:#9fd3e6;margin-top:6px}
.zArt canvas{width:100%;height:auto;aspect-ratio:3/2;display:block;image-rendering:pixelated;border-top:2px solid var(--gold2);border-bottom:2px solid var(--gold2)}
.zType{font-size:20px;color:#9fd3e6;text-align:center;padding:6px 0 2px}
.zList{list-style:none;margin:0;padding:6px 14px;font-size:21px;line-height:1.1;color:var(--ink)}
.zList li{margin-bottom:8px;padding-left:14px;position:relative}
.zList li::before{content:'▪';position:absolute;left:0;color:var(--gold)}
.zStats{display:flex;justify-content:space-between;padding:4px 14px;font-family:'Press Start 2P',monospace;font-size:14px}
.zStats span{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:0;border:2px solid var(--gold2);box-shadow:0 0 0 2px var(--night),0 2px 0 #000;text-shadow:0 1px 0 #000}
.zBuffs{margin:8px 14px 0;padding:6px 8px;border:2px solid var(--gold2);background:rgba(10,8,4,.55);font-size:12px;line-height:1.45;color:#f1e6c8;text-align:left}
.zBuffs b{display:block;text-align:left;color:var(--gold2);font-family:'Press Start 2P',monospace;font-size:9px;font-weight:normal;margin-bottom:4px}
.zBuffs .bf{display:flex;justify-content:space-between;gap:8px}
.zBuffs .bf em{font-style:normal;color:#ffe39a;font-weight:bold}

/* Анимации (длительности масштабируются настройкой скорости) */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes drawIn{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
.enter{animation:drawIn calc(.35s*var(--spd)) cubic-bezier(.2,.8,.3,1) both}
@keyframes lunge{0%{transform:none}35%{transform:translateY(-22px) scale(1.08)}60%{transform:translateY(10px)}80%{transform:translateY(-2px)}100%{transform:none}}
.lunge{animation:lunge calc(.42s*var(--spd)) ease-out}
@keyframes hitFlash{0%,100%{filter:none}25%{filter:brightness(2.6) saturate(0)}60%{filter:brightness(1.5)}}
.hitflash{animation:hitFlash calc(.3s*var(--spd)) ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake calc(.3s*var(--spd)) linear}
@keyframes readyGlow{0%,100%{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--green)}50%{box-shadow:0 0 0 2px var(--night),0 0 0 6px var(--green),0 0 14px var(--green)}}
.card.ready{animation:readyGlow calc(1.2s*var(--spd)) ease-in-out infinite}
@keyframes selBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card.sel{animation:selBob calc(.6s*var(--spd)) ease-in-out infinite}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
.float{position:fixed;font-family:'Press Start 2P',monospace;font-size:16px;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:30;animation:floatUp calc(.9s*var(--spd)) ease-out forwards}
@keyframes quakeK{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.quake{animation:quakeK calc(.35s*var(--spd)) linear}
.bit{position:absolute;top:-12px;width:8px;height:8px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---- v4: анимации боя, герои, путь серии ---- */
.proj{position:fixed;left:0;top:0;width:24px;height:8px;pointer-events:none;z-index:28;image-rendering:pixelated}
.ghostCard{position:fixed;pointer-events:none;z-index:26;margin:0;animation:ghostOut calc(.6s*var(--spd)) ease-in forwards}
@keyframes ghostOut{0%{opacity:1}60%{opacity:.85;filter:brightness(1.8)}100%{opacity:0;transform:translateY(-10px) scale(.9)}}
.shard{position:fixed;width:6px;height:6px;pointer-events:none;z-index:27;animation:shardFly calc(.7s*var(--spd)) ease-out forwards}
@keyframes shardFly{to{transform:translate(var(--sx),var(--sy)) rotate(180deg);opacity:0}}
.beam{position:fixed;width:12px;pointer-events:none;z-index:24;transform-origin:bottom;animation:beamK calc(.7s*var(--spd)) ease-out forwards}
@keyframes beamK{0%{transform:scaleY(0);opacity:1}45%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.spellFx{position:fixed;inset:0;pointer-events:none;z-index:23;animation:spellK calc(.5s*var(--spd)) ease-out forwards}
@keyframes spellK{0%{opacity:.8}100%{opacity:0}}
.banner{position:fixed;left:0;right:0;top:44%;height:52px;z-index:35;pointer-events:none;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#c9a96a 0 10px,#8a4b12 10px 20px);box-shadow:0 0 0 3px var(--night);font-family:'Press Start 2P',monospace;font-size:14px;color:#241a00;text-shadow:0 2px 0 #f5e6b8;white-space:nowrap;animation:bannerK calc(1.1s*var(--spd)) ease-in-out forwards}
@keyframes bannerK{0%{transform:translateX(-105%)}40%,60%{transform:translateX(0)}100%{transform:translateX(105%)}}
/* Кристаллы маны: заполнение искрой, доступные для траты мигают */
.cr.cr-fill{animation:crFill calc(.45s*var(--spd)) ease-out}
@keyframes crFill{0%{transform:scale(.2);filter:brightness(3)}60%{transform:scale(1.3);filter:brightness(2)}100%{transform:none;filter:none}}
.cr.cr-blink{animation:crBlink calc(.9s*var(--spd)) steps(2,start) infinite}
@keyframes crBlink{0%{opacity:1}50%{opacity:.35}}
/* Карта вылетает из колоды по дуге */
.card.deal{animation:dealIn calc(.55s*var(--spd)) ease-out backwards;animation-delay:calc(var(--i,0)*.07s*var(--spd))}
@keyframes dealIn{0%{transform:translate(var(--dx),var(--dy)) rotate(-25deg) scale(.5);opacity:0}55%{transform:translate(calc(var(--dx)*.35),calc(var(--dy)*.35 - 36px)) rotate(4deg) scale(1);opacity:1}100%{transform:none;opacity:1}}
.dn{display:inline-block}
.dn.bump{animation:bumpK calc(.4s*var(--spd)) ease-out}
@keyframes bumpK{0%{transform:translateY(0)}40%{transform:translateY(-6px) scale(1.25)}100%{transform:none}}
/* Портреты дышат */
.pframe canvas{animation:breathe calc(3s*var(--spd)) ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
/* Броня: пиксельный щит, трескается при потере */
.pframe .oar{right:2px;bottom:2px;width:30px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;background:#7fb8ff;color:#06203a;font-size:10px;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);box-shadow:none}
.pframe .oar.oar-crack{background:linear-gradient(118deg,#7fb8ff 0 45%,#06203a 45% 49%,#7fb8ff 49% 62%,#06203a 62% 64%,#7fb8ff 64%)}
.pframe .oar.oar-empty{opacity:.35}
.pframe .oar.shake{animation:shake calc(.3s*var(--spd)) linear}
/* Шкала здоровья: сегменты */
.segs{display:flex;gap:1px;height:8px;width:100px}
.segs i{flex:1 1 0;background:#2b3a4f}
#pSegs i.on{background:var(--green)}
#aSegs i.on{background:var(--red)}
/* Путь серии: клетки побед и фонарики поражений */
#road{display:flex;align-items:center;gap:3px;padding:5px 10px;background:rgba(4,17,31,.75);border-bottom:2px solid var(--gold2)}
#road .rd{flex:1 1 0;height:8px;background:#2b3a4f;box-shadow:0 0 0 1px var(--night)}
#road .rd.won{background:var(--gold)}
#road .rd.cur{background:#7fb8ff;animation:crBlink calc(1s*var(--spd)) steps(2,start) infinite}
#road .lamps{display:flex;gap:4px;margin-left:6px}
#road .lamp{width:9px;height:9px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 6px #ff7a1a}
#road .lamp.off{background:#2b3a4f;box-shadow:none}
/* Силуэт Андалусии и время суток */
/* Фон: пиксельный ночной город с куполами, минаретами, пальмами и фонарями (рисуется на canvas) */
#skyline{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#skyline canvas{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
body[data-time=day]{background:linear-gradient(#2c7ba6,#0c3550)}
body[data-time=dusk]{background:linear-gradient(#7a3b5a,#1b1030)}
body[data-time=night]{background:linear-gradient(#0a1a36,#02050c)}
/* Драфт: карты переворачиваются по очереди, приподнимаются при наведении */
.draftRow .card{animation:flipIn calc(.45s*var(--spd)) ease-out backwards;animation-delay:calc(var(--i,0)*.12s*var(--spd))}
@keyframes flipIn{from{transform:perspective(500px) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.draftRow .card:hover{transform:translateY(-8px)}
/* Иконки ключевых слов */
.ki{display:inline-block;width:9px;height:10px;vertical-align:-1px;margin:0 1px}
.ki-shield{background:#ffc857;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.ki-sword{width:7px;background:#dfe9f5;clip-path:polygon(42% 0,58% 0,58% 70%,100% 70%,100% 84%,58% 84%,58% 100%,42% 100%,42% 84%,0 84%,0 70%,42% 70%)}
.ki-drop{background:#ff6b6b;clip-path:polygon(50% 0,100% 62%,84% 96%,50% 100%,16% 96%,0 62%)}
.ki-thorn{width:11px;background:#c9a96a;clip-path:polygon(0 100%,8% 0,17% 100%,33% 0,42% 100%,58% 0,67% 100%,83% 0,92% 100%,100% 100%)}

#shop{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shopCell{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.shopCell .pbtn{font-size:9px;padding:6px 6px}
</style>
</head>
<body>
<div id="skyline"></div>
<div id="app">
  <header>
    <h1>АРЕНА</h1>
    <div id="status"></div>
    <div id="score" class="hdrBtn"></div>
    <button id="quit" class="pbtn sm ghost hdrBtn" aria-label="Выйти в меню">✕</button>
  </header>
  <div id="road"></div>
  <main id="screen" style="display:flex;flex-direction:column;flex:1;min-height:0"></main>
  <div id="discover"><h2>Раскопка</h2><div class="sub">Выберите одну карту</div><div class="draftRow" id="dOpts"></div></div>
  <div id="ask"><h2 id="askTxt"></h2><div class="row"><button class="pbtn" id="askYes">ДА</button><button class="pbtn ghost" id="askNo">ОТМЕНА</button></div></div>
  <div id="relic"><h2>Награда</h2><div class="sub">Выберите улучшение на всю серию</div><div class="relicList" id="relicList"></div></div>
  <div id="overlay">
    <div id="res"></div>
    <div id="sub"></div>
    <div class="row">
      <button class="pbtn" id="next">СЛЕДУЮЩИЙ МАТЧ</button>
      <button class="pbtn ghost" id="again">В МЕНЮ</button>
    </div>
  </div>
  <div id="zoom"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const clone=c=>({...c});
let uid=1;
// Базовые характеристики печатные; бонусы (buffs) хранятся списком и копируются при создании экземпляра
const inst=c=>({...c,uid:uid++,hp:c.hp??0,atk:c.atk??0,atks:0,noHero:false,
  baseAtk:c.baseAtk??c.atk??0, baseHp:c.baseHp??c.hp??0, buffs:(c.buffs||[]).map(x=>({...x}))});
const MAX_HP=20, WIN_GOAL=13, LOSS_LIMIT=3, MAX_BOARD=7, MAX_HAND=10, MAX_MANA=10;

/* ---------- Настройки и хранилище ---------- */
const KEY_SAVE='arena-save-v2', KEY_SET='arena-settings-v1';
const SPEEDS={fast:.5,normal:1,slow:1.8};
const SPEED_NAME={fast:'БЫСТРО',normal:'ОБЫЧНО',slow:'МЕДЛЕННО'};
const SET={sound:true,speed:'normal',tutDone:false};
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
Object.assign(SET,lsGet(KEY_SET)||{});
function saveSet(){ lsSet(KEY_SET,SET); }
function applySettings(){ document.documentElement.style.setProperty('--spd',SPEEDS[SET.speed]||1); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms*(SPEEDS[SET.speed]||1))); }

/* ---------- Звук: короткие 8-битные сигналы через Web Audio, без файлов ---------- */
let AC=null;
function sfx(kind,arg){
  if(!SET.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t0=AC.currentTime;
    const tone=(f1,f2,dur,type,vol,delay=0)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.setValueAtTime(f1,t0+delay);
      if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+delay+dur);
      g.gain.setValueAtTime(vol,t0+delay); g.gain.exponentialRampToValueAtTime(0.001,t0+delay+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0+delay); o.stop(t0+delay+dur+0.02);
    };
    const SND={
      hit:()=>tone(220,60,.18,'square',.25),
      big:()=>{ tone(160,40,.35,'sawtooth',.3); tone(90,30,.4,'square',.2,.05); },
      // Тема задаёт тембр призыва: Крепость — низкий квадрат, Пустыня — пила с падением, Сады — колокольчик
      summon:(t)=>{
        if(t==='fortress') tone(110,165,.3,'square',.22);
        else if(t==='desert') tone(440,300,.3,'sawtooth',.12);
        else if(t==='gardens'){ tone(1046,1046,.25,'sine',.2); tone(1568,1568,.2,'sine',.12,.08); }
        else tone(330,990,.22,'triangle',.25);
      },
      thaw:()=>{ tone(1568,2093,.18,'triangle',.2); tone(2637,2637,.22,'sine',.12,.1); },
      spell:()=>{ tone(523,523,.07,'square',.18); tone(659,659,.07,'square',.18,.07); tone(988,988,.1,'square',.18,.14); },
      click:()=>tone(700,500,.05,'square',.12),
      power:()=>tone(440,880,.15,'triangle',.22),
      heal:()=>tone(523,784,.2,'triangle',.2),
      win:()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,f,.16,'square',.2,i*.12)); },
      lose:()=>{ [392,330,262,196].forEach((f,i)=>tone(f,f,.22,'square',.18,i*.16)); },
      freeze:()=>tone(1200,300,.25,'triangle',.18),
      relic:()=>{ [659,880,1318].forEach((f,i)=>tone(f,f,.14,'triangle',.22,i*.08)); },
    };
    (SND[kind]||SND.click)(arg);
  }catch(e){}
}

/* ---------- Палитры: [верх, низ, акцент, светлый] ---------- */
const PALS=[
  ['#14487a','#071c33','#e9c46a','#f5efdc'],
  ['#8c3b22','#2e110a','#f0a86a','#ffe6c4'],
  ['#16614f','#062a22','#9fe0c4','#eafff4'],
  ['#8a6424','#2a1c08','#f2d27a','#fff4d0'],
  ['#d9d1bd','#6e6654','#1d5b8c','#ffffff'],
  ['#1d7f9a','#06303d','#bff0ff','#f0feff'],
  ['#27214a','#0c0a1e','#e9c46a','#fff8e1'],
  ['#7a1f3d','#2a0814','#f2b3c4','#fff0f4'],
  ['#3d4a2a','#141c0c','#d6e39a','#f6fbe6'],
  ['#4a3a1f','#17120a','#ffd27a','#fff7e0'],
  ['#4b2a7a','#1b0c33','#c9a7ff','#f3e8ff'],
];

/* ---------- Редкость ---------- */
const RNAME={common:'Обычная',rare:'Редкая',myth:'Мифическая',leg:'Легендарная'};
const RCLS={common:'rc',rare:'rr',myth:'rm',leg:'rl'};
const RCOL={common:'#f4f0ff',rare:'#7fb8ff',myth:'#c49bff',leg:'#ffc857'};
const RW=[['common',58],['rare',26],['myth',12],['leg',4]];

/* ---------- Темы для синергии ---------- */
const TAG_OF={
  fortress:['castle','walls','tower','citadel','gate','arch','banner','helmet','knight','warrior','cuirass'],
  desert:['mountain','wave','sun','catapult','horn','horse','cavalry','hourglass'],
  gardens:['palm','fountain','lantern','amphora','mosaic','key','bridge'],
};
const TAG_NAME={fortress:'Крепость',desert:'Пустыня',gardens:'Сады'};
function tagOf(motif){ for(const t in TAG_OF) if(TAG_OF[t].includes(motif)) return t; return null; }

/* ---------- Карты ----------
   M(имя, цена, атк, здоровье, ключевые слова, сюжет, палитра, редкость, эффекты)
   Ключевые слова: t Заслон, c Рывок, r Натиск, d Щит, w Ветер, s Маскировка,
                   l Вампиризм, b Возрождение, e Ярость, h Шипы (2)
   S_(имя, цена, эффект, значение, сюжет, палитра, редкость, доп.)
   Эффекты существ: bc (боевой клич), dr (предсмертный хрип) — {eff, val, tok?} */
const M=(name,cost,atk,hp,kw,motif,pal,rar='common',fx={})=>({
  type:'minion',name,cost,atk,hp,rar,baseAtk:atk,baseHp:hp,buffs:[],
  taunt:kw.includes('t'),charge:kw.includes('c'),rush:kw.includes('r'),
  divine:kw.includes('d'),windfury:kw.includes('w'),stealth:kw.includes('s'),
  lifesteal:kw.includes('l'),reborn:kw.includes('b'),enrage:kw.includes('e'),
  thorns:kw.includes('h')?2:0,
  bc:fx.bc||null,dr:fx.dr||null,motif,pal});
const S_=(name,cost,eff,val,motif,pal,rar='common',x={})=>({type:'spell',name,cost,eff,val,motif,pal,rar,...x});
const TK=(name,atk,hp,motif,pal,kw='')=>M(name,0,atk,hp,kw,motif,pal,'common');
const COIN=S_('Монетка',0,'coin',1,'sun',6,'common');

const POOL=[
  /* ===== Базовые карты (38) ===== */
  M('Юный слуга дворца',1,1,2,'','sword',0,'common'),
  M('Страж Гибралтара',3,2,4,'t','shield',0,'common'),
  M('Лучник Альпухарры',2,2,3,'','bow',0,'common'),
  M('Серп луны над Альгамброй',3,2,3,'d','crescent',0,'rare'),
  M('Гонец Гранады',3,2,3,'c','horse',0,'common'),
  M('Мастер фонарей Альгамбры',2,1,3,'','lantern',0,'rare',{bc:{eff:'heal',val:2}}),
  M('Стена из сырцового кирпича',3,0,6,'t','walls',0,'common'),
  M('Часовой Хиральды',3,2,4,'','tower',0,'common',{dr:{eff:'draw',val:1}}),

/* ---------- Уникальный арт: сюжет + фон + палитра не повторяются, тема для синергии ---------- */
function hashStr(s){ let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return h; }
function assignArt(list){
  const used=new Set(), N=BGS.length*PALS.length;
  list.forEach(c=>{
    c.tag=tagOf(c.motif);
    const h=hashStr(c.name);
    for(let k=0;k<N;k++){
      const idx=(h+k)%N, bg=idx%BGS.length, pal=Math.floor(idx/BGS.length);
      const key=c.motif+'|'+bg+'|'+pal;
      if(!used.has(key)){ used.add(key); c.bg=bg; c.pal=pal; return; }
    }
  });
}

/* ---------- Арт: рисуем в высоком разрешении, затем уменьшаем до пиксельной сетки 60×40 ---------- */
function poly(c,cx,cy,R,r,n){
  c.beginPath();
  for(let i=0;i<n*2;i++){
    const a=i*Math.PI/n-Math.PI/2, rr=i%2?r:R;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    i?c.lineTo(x,y):c.moveTo(x,y);
  }
  c.closePath();
}
function P(c,pts,fill){
  c.fillStyle=fill; c.beginPath();
  pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.closePath(); c.fill();
}

/* Фоны: шесть видов узора */
const BGS=[
  (c,W,H,A)=>{ c.strokeStyle=A; c.lineWidth=1; c.globalAlpha=.16;
    for(let x=0;x<=W+50;x+=50) for(let y=0;y<=H+50;y+=50){ poly(c,x+(y/50%2)*25,y,20,9,8); c.stroke(); }
    c.globalAlpha=1; },
  (c,W,H,A)=>{ c.fillStyle=A; c.globalAlpha=.14;
    for(let x=-10;x<W+40;x+=46){ c.beginPath(); c.arc(x,H,22,Math.PI,0); c.fill(); }
    c.globalAlpha=1; },
  (c,W,H,A,L)=>{ c.globalAlpha=.16;
    for(let i=0;i<24;i++){ const a0=i*Math.PI/12; c.fillStyle=i%2?A:L; c.beginPath(); c.moveTo(W/2,H/2-6); c.arc(W/2,H/2-6,W,a0,a0+Math.PI/24); c.closePath(); c.fill(); }
    c.globalAlpha=1; },
  (c,W,H,A,L)=>{ c.fillStyle=L; c.globalAlpha=.5; let s=7;
    for(let i=0;i<40;i++){ s=(s*9301+49297)%233280; const x=(s/233280)*W; s=(s*9301+49297)%233280; const y=(s/233280)*H; c.fillRect(x,y,2,2); }
    c.globalAlpha=1; },
  (c,W,H,A)=>{ c.strokeStyle=A; c.lineWidth=6; c.globalAlpha=.14;
    for(let k=-H;k<W;k+=28){ c.beginPath(); c.moveTo(k,0); c.lineTo(k+H,H); c.stroke(); }
    c.globalAlpha=1; },
  (c,W,H,A,L)=>{ c.strokeStyle=L; c.lineWidth=2; c.globalAlpha=.16;
    for(let r=20;r<260;r+=26){ c.beginPath(); c.arc(W/2,H-10,r,Math.PI,0); c.stroke(); }
    c.globalAlpha=1; },
];

/* Сюжеты. Все рисуются в центре (x,y); лица и глаза не рисуются. */
function blade(c,x,y,ang,A,L,D){
  c.save(); c.translate(x,y); c.rotate(ang);
  c.fillStyle=L; c.beginPath(); c.moveTo(0,-84); c.lineTo(9,14); c.lineTo(-9,14); c.closePath(); c.fill();
  c.fillStyle=A; c.fillRect(-34,12,68,10);
  c.fillStyle=D; c.fillRect(-6,22,12,30);
  c.fillStyle=A; c.beginPath(); c.arc(0,58,8,0,Math.PI*2); c.fill();
  c.restore();
}
function lance(c,x,y,A,L,D,s=1){
  c.save(); c.translate(x,y); c.rotate(-0.5); c.scale(s,s);
  c.fillStyle=D; c.fillRect(-3,-96,6,190);
  c.fillStyle=L; c.beginPath(); c.moveTo(0,-112); c.lineTo(8,-94); c.lineTo(-8,-94); c.closePath(); c.fill();
  c.fillStyle=A; c.beginPath(); c.moveTo(3,-88); c.lineTo(58,-74); c.lineTo(3,-62); c.closePath(); c.fill();
  c.restore();
}
function helmet(c,x,y,A,L,D){
  c.fillStyle=A; c.beginPath(); c.moveTo(x-46,y+40); c.lineTo(x-46,y-6); c.arc(x,y-6,46,Math.PI,0);
  c.lineTo(x+46,y+40); c.lineTo(x+30,y+46); c.lineTo(x-30,y+46); c.closePath(); c.fill();
  c.fillStyle=D; c.fillRect(x-32,y+2,64,8);
  c.fillStyle=L; c.fillRect(x-4,y-30,8,28);
  P(c,[[x,y-54],[x+14,y-30],[x-14,y-30]],L);
}
function horse(c,x,y,A,L,D,s=1){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle=A; c.beginPath(); c.ellipse(0,10,50,22,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.moveTo(26,0); c.lineTo(40,-44); c.lineTo(62,-52); c.lineTo(64,-40); c.lineTo(46,-24); c.lineTo(44,10); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(-42,-2); c.quadraticCurveTo(-74,0,-66,36); c.lineTo(-58,34); c.quadraticCurveTo(-64,6,-38,6); c.closePath(); c.fill();
  c.fillRect(-36,24,9,46); c.fillRect(-20,24,9,46); c.fillRect(20,24,9,46); c.fillRect(34,24,9,46);
  c.fillStyle=D; c.beginPath(); c.moveTo(40,-44); c.lineTo(34,-30); c.lineTo(44,-30); c.closePath(); c.fill();
  c.restore();
}

function renderArt(cv,motif,bg,pal){
  const W=cv.width=300,H=cv.height=200,c=cv.getContext('2d');
  const [top,bot,A,L]=PALS[pal];
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bot);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  BGS[bg](c,W,H,A,L);
  MOTIF[motif](c,W/2,H/2-6,A,L,bot);
}
const artCache={};
function artFor(c){
  const bg=c.bg??(hashStr(c.name)%BGS.length);
  const key=c.motif+'|'+bg+'|'+c.pal;
  if(!artCache[key]){
    const big=document.createElement('canvas');
    renderArt(big,c.motif,bg,c.pal);
    const px=document.createElement('canvas'); px.width=120; px.height=80;
    px.getContext('2d').drawImage(big,0,0,120,80);
    artCache[key]=px;
  }
  return artCache[key];
}
function drawArt(cv,c){
  const src=artFor(c);
  cv.width=src.width; cv.height=src.height;
  const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false; ctx.drawImage(src,0,0);
}

/* Цели приёмов: hit — враг (герой или существо), friend — своё существо,
   enemy — существо врага, minion — любое существо, кроме героя */
const TGT={dmg:'hit',buff:'friend',silence:'minion',kill:'enemy',mheal:'friend',freeze:'enemy'};
function canTarget(eff,side,t){
  const hero=t==='hero';
  switch(TGT[eff]){
    case 'hit': return side==='a'&&(hero||!t.stealth);
    case 'friend': return side==='p'&&!hero;
    case 'minion': return !hero&&(side==='p'||!t.stealth);
    case 'enemy': return side==='a'&&!hero&&!t.stealth;
    default: return false;
  }
}
function kwText(c){
  if(c.type==='minion'){
    const k=Object.keys(KW).filter(x=>c[x]).map(x=>KW[x]);
    if(c.thorns) k.push('Шипы '+c.thorns);
    if(c.tag) k.push('Тема: '+TAG_NAME[c.tag]);
    if(c.bc) k.push('Боевой клич: '+fxText(c.bc));
    if(c.dr) k.push('Предсмертный хрип: '+fxText(c.dr));
    return k.join('. ')||'Существо';
  }
  return fxText(c);
}
function shortText(c){
  if(c.type==='spell') return SHORT[c.eff](c);
  const ICON={taunt:'<i class="ki ki-shield" title="Заслон"></i>',charge:'<i class="ki ki-sword" title="Рывок"></i>',lifesteal:'<i class="ki ki-drop" title="Вампиризм"></i>'};
  const k=Object.keys(KWS).filter(x=>c[x]).map(x=>ICON[x]||KWS[x]);
  if(c.thorns) k.push('<i class="ki ki-thorn" title="Шипы"></i>'+c.thorns);
  if(c.tag) k.push(TAG_NAME[c.tag]);
  if(c.bc) k.push('БК: '+SHORT[c.bc.eff](c.bc));
  if(c.dr) k.push('ПХ: '+SHORT[c.dr.eff](c.dr));
  return k.join(' · ')||'—';
}
function abilityLines(c){
  if(c.type==='minion'){
    const k=Object.keys(KW).filter(x=>c[x]).map(x=>`${KW[x]} — ${KWDESC[x]}`);
    if(c.thorns) k.push(`Шипы ${c.thorns} — атакующий получает столько же урона`);
    if(c.tag) k.push(`Тема «${TAG_NAME[c.tag]}» — при розыгрыше +1/+1, если на поле уже есть такая же`);
    if(c.bc) k.push('Боевой клич: '+fxText(c.bc));
    if(c.dr) k.push('Предсмертный хрип: '+fxText(c.dr));
    return k.length?k:['Без особых свойств'];
  }
  return [fxText(c)];
}

/* ---------- Элементы карт ---------- */
function cardEl(c,o={}){
  const v=o.v||'full';
  const el=document.createElement('div');
  const isM=c.type==='minion';
  /* Маскировка затеняет существо только на поле, в руке и в окне карты — нет */
  const kw=isM?(c.divine?' divine':'')+(c.stealth&&v==='board'?' stealthy':''):'';
  el.className=`card ${v} ${RCLS[c.rar]||'rc'}${kw}${c.frozen?' frz':''}${c.type==='spell'?' spell':''}${isM?' mn':''}${o.cls?' '+o.cls:''}`;
  if(c.uid!==undefined) el.dataset.uid=c.uid;
  el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label',c.name);
  const cv=document.createElement('canvas'); drawArt(cv,c); el.appendChild(cv);
  const text=v==='full'?`<div class="text">${kwText(c)}</div>`:v==='hand'?`<div class="text">${shortText(c)}</div>`:'';
  /* Кнопка «i» открывает карту полностью: ключевые слова и пояснения */
  const info=(v==='full'||v==='hand')?`<button class="cinfo" aria-label="Подробнее о карте" title="Подробнее">i</button>`:'';
  const frost=c.frozen?'<i class="frost"></i>':'';
  const ring=c.rar==='leg'?'<i class="mring"></i>':'';
  el.insertAdjacentHTML('beforeend',
    `${frost}${ring}<i class="gem"></i><div class="cost">${c.cost}</div><div class="name">${c.name}</div>`+text+info+
    (isM?`<div class="stats"><span class="atk">${c.atk}</span><span class="hp">${c.hp}</span></div>`:''));
  const ib=el.querySelector('.cinfo');
  if(ib) ib.addEventListener('click',e=>{ e.stopPropagation(); e.preventDefault(); sfx('click'); showZoom(c,true); });
  bindCard(el,c);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } });
  return el;
}

/* Долгое нажатие (≈0.4 с) показывает карту на весь экран; отпускание закрывает */
function bindCard(el,c){
  let timer=null, fired=false;
  const start=()=>{ fired=false; clearTimeout(timer); timer=setTimeout(()=>{ fired=true; showZoom(c); },400); };
  const stop=()=>{ clearTimeout(timer); if(fired) hideZoom(); };
  el.addEventListener('pointerdown',start);
  el.addEventListener('pointerup',stop);
  el.addEventListener('pointerleave',stop);
  el.addEventListener('pointercancel',stop);
  el.addEventListener('pointermove',()=>{ if(!fired) clearTimeout(timer); });
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',e=>{ if(fired){ e.stopImmediatePropagation(); e.preventDefault(); fired=false; } },true);
}
// Бонусы существа показываются в карте отдельно от печатных характеристик
function zBuffsHtml(c){
  const list=(c.buffs||[]).filter(b=>b.da||b.dh);
  if(!list.length) return '<div class="zBuffs"><b>Бонусы</b>Бонусов нет</div>';
  return '<div class="zBuffs"><b>Бонусы</b>'+list.map(b=>`<div class="bf"><span>${b.label}</span><em>+${b.da}/+${b.dh}</em></div>`).join('')+'</div>';
}
let zoomSticky=false;
/* Подробная карта: sticky — по кнопке «i», поле заблокировано, закрывается крестиком, фоном или назад */
function showZoom(c,sticky){
  const z=$('#zoom');
  const isM=c.type==='minion';
  const lines=abilityLines(c).map(l=>`<li>${l}</li>`).join('');
  z.innerHTML=`<div class="zc ${RCLS[c.rar]||''}">
      ${sticky?'<button class="zX" aria-label="Закрыть">✕</button>':''}
      <div class="zTop"><div class="cost">${c.cost}</div><div class="zName">${c.name}</div></div>
      <div class="zArt"></div>
      <div class="zType">${isM?'Существо':'Приём'} · <span style="color:${RCOL[c.rar]}">${RNAME[c.rar]}</span></div>
      <ul class="zList">${lines}</ul>
      ${isM?`<div class="zStats"><span class="atk">${c.baseAtk??c.atk}</span><span class="hp">${c.baseHp??c.hp}</span></div>${zBuffsHtml(c)}`:''}
    </div>`;
  const cv=document.createElement('canvas'); drawArt(cv,c); z.querySelector('.zArt').appendChild(cv);
  z.classList.toggle('sticky',!!sticky);
  z.classList.add('show');
  zoomSticky=!!sticky;
  z.onclick=null;
  if(sticky){
    const prev=BACK;
    setBack(()=>{ hideZoom(); if(prev) setBack(prev); });
    const closeSticky=()=>{ if(zoomSticky){ zoomSticky=false; history.back(); } };
    z.querySelector('.zX').onclick=closeSticky;
    z.onclick=e=>{ if(e.target===z) closeSticky(); };
  }
}
function hideZoom(){ const z=$('#zoom'); z.classList.remove('show','sticky'); z.onclick=null; zoomSticky=false; }

/* Редкость случайной карты: обычная 58%, редкая 26%, мифическая 12%, легендарная 4% */
function pickRarity(){
  let r=rnd(100);
  for(const [k,w] of RW){ if(r<w) return k; r-=w; }
  return 'common';
}
function randomCard(){
  const pool=BY_R[pickRarity()];
  return clone(pool[rnd(pool.length)]);
}
function genOpts(){
  const out=[], names=new Set();
  while(out.length<3){
    const c=randomCard();
    if(names.has(c.name)) continue;
    names.add(c.name); out.push(c);
  }
  return out;
}

/* Портреты героев: фигура в капюшоне без лица — внутри капюшона чернота. Синяя у игрока, красная у противника (с круглым щитом). */
function drawHeroPortrait(cv,who){
  const g=cv.getContext('2d');
  const N=40; cv.width=N; cv.height=N;
  const P=who==='p'
    ?{sky:['#1b2a55','#e7854a'],far:'#3b2350',robe:'#1f5aa8',robeL:'#4f8bd6',robeD:'#0c2a58',trim:'#ffc857',hood:'#07101e',gem:'#4aa0ff'}
    :{sky:['#2a0c18','#c4502a'],far:'#4a1a22',robe:'#7a1c1c',robeL:'#a8392c',robeD:'#3d0b0b',trim:'#d9a94a',hood:'#130607',gem:'#ff4a4a'};
  const R=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,h); };
  /* небо и силуэт города за спиной */
  const sg=g.createLinearGradient(0,0,0,N); sg.addColorStop(0,P.sky[0]); sg.addColorStop(1,P.sky[1]);
  g.fillStyle=sg; g.fillRect(0,0,N,N);
  R(0,24,N,16,P.far);
  [[1,3,7],[5,4,11],[10,3,6],[15,2,13],[24,4,10],[29,3,14],[33,4,8]].forEach(([x,w,h])=>R(x,24-h,w,h+16));
  R(15,4,1,9,P.far); R(14,3,1,1,P.far);            /* минарет */
  R(0,35,N,5,P.robeD);                               /* камни у ног */
  /* плащ: широкие плечи, складки */
  for(let y=18;y<N;y++){ const hw=Math.min(15,Math.round(9+(y-18)*.4)); R(20-hw,y,hw*2,1,P.robe); }
  for(let y=22;y<N;y++){ R(13,y,1,1,P.robeD); R(27,y,1,1,P.robeD); R(20,y,1,1,P.robeL); }
  /* капюшон: острый верх, внутри — пустота вместо лица */
  const hoodW=y=>Math.min(7,Math.round(1+(y-3)*1.3));
  for(let y=3;y<=19;y++){ const hw=hoodW(y); R(20-hw,y,hw*2,1,P.hood); }
  for(let y=5;y<=18;y++){ const hw=hoodW(y); R(20-hw,y,1,1,P.robeL); }
  for(let y=9;y<=19;y++){ const k=Math.round(4.5*Math.sqrt(Math.max(0,1-((y-14)/6)**2))); if(k>0) R(20-k,y,k*2,1,'#010203'); }
  /* золотая кромка капюшона и воротник */
  for(let y=4;y<=18;y++){ const hw=hoodW(y)+1; R(20-hw,y,1,1,P.trim); R(19+hw,y,1,1,P.trim); }
  R(14,19,12,1,P.trim); R(18,20,4,1,P.trim);
  /* ромб-самоцвет внизу, как на рамках карт */
  for(let dy=-3;dy<=3;dy++){ const hw=3-Math.abs(dy); R(20-hw,33+dy,hw*2,1,P.gem); }
  R(19,30,2,1,'#ffffff');
  if(who!=='p'){
    /* круглый щит у противника */
    for(let dy=-7;dy<=7;dy++){ const hw=Math.round(Math.sqrt(49-dy*dy)); R(11-hw,27+dy,hw*2,1,P.trim); }
    for(let dy=-5;dy<=5;dy++){ const hw=Math.round(Math.sqrt(25-dy*dy)); R(11-hw,27+dy,hw*2,1,P.robeD); }
    R(10,26,2,2,P.trim);
  }
}

/* Мозаика: плитки закрывают экран, затем рассыпаются. Клики проходят сквозь них. */
function go(fn){
  fn();
  const host=document.createElement('div'); host.className='mosaic';
  const pal=['#c9a96a','#1d6f73','#8a2a22','#e8d7a6','#0f4c5c'];
  for(let r=0;r<14;r++) for(let c=0;c<8;c++){
    const t=document.createElement('i');
    t.style.background=pal[(r*3+c*5)%pal.length];

  }
  document.body.appendChild(host);

}

/* Автовыбор: оценка карты для быстрой колоды — силовые показатели, ключевые слова, редкость, умеренная стоимость */
function autoScore(c){
  const rw={common:0,rare:1,myth:2,leg:3}[c.rar]||0;
  if(c.type==='spell') return 4+rw*1.5+(c.eff==='dmg'||c.eff==='aoe'?1:0);
  const kw=['taunt','charge','divine','windfury','lifesteal','reborn','enrage'].filter(k=>c[k]).length
    +(c.thorns?1:0)+(c.rush?.5:0)+(c.stealth?.5:0);
  return c.atk+c.hp+kw*1.2+rw*1.5-Math.max(0,c.cost-6);
}
function autoBest(){
  let bi=0,bs=-1e9;
  D.opts.forEach((c,i)=>{
    const same=D.picks.filter(p=>Math.min(p.cost,7)===Math.min(c.cost,7)).length;
    const s=autoScore(c)-(same>=6?2:0);
    if(s>bs){ bs=s; bi=i; }
  });
  return bi;
}
/* Досбирает колоду лучшими вариантами и сразу открывает экран колоды — оттуда одна кнопка до боя */
function autoDraft(){
  sfx('click');
  while(D.picks.length<D.size){
    D.picks.push(clone(D.opts[autoBest()]));
    if(D.picks.length<D.size) D.opts=genOpts();

  persist('deck');
  showDeck();
}
function drawCurve(){
  const b=[0,0,0,0,0,0,0];

    `<div class="col"><div class="bar" style="height:${n?Math.max(8,n/max*70):0}px">${n||''}</div><small>${i===6?'7+':i+1}</small></div>`).join('');
}
function pick(i){

function startSeries(){

function startMatch(){ go(startMatchRaw); }
function startMatchRaw(){
  S.route=null;

  const first=Math.random()<.5?'p':'a';

    let best=randomCard();

    if(best.type==='minion'){

    }
    return best;
  });
  G={p:newSide(D.picks),a:newSide(aiDeck),first,turn:first,busy:false,over:false,
     sel:null,atk:null,mull:new Set(),lunge:null,powerSel:false,coinFor:first==='p'?'a':'p',
     note:boss?'БОСС: шипы у существ соперника':'',elite:!!S.elite,boss,persona:pers.name};
  G.p.extraMana=S.relics.includes('mana')?1:0;
  G.p.spellBonus=S.relics.includes('spell')?1:0;
  G.p.armor=(S.relics.includes('armor')?4:0)+(S.nextArmor||0);
  S.nextArmor=0; S.elite=false;
  prevHp.clear(); seen.clear(); prevHero={p:null,a:null};
  prevTurn=null; prevMana=0; prevDeck={p:null,a:null}; prevArmor={p:null,a:null}; armorCrack={p:false,a:false};
  document.body.dataset.time=S.wins>=10?'night':S.wins>=5?'dusk':'day';
  buildSkyline();
  draw(G.p,first==='p'?3:4);
  draw(G.a,first==='a'?3:4);
  if(S.relics.includes('start')) placeMinion(G.p,inst(TK('Оруженосец',1,1,'helmet',1)));
  if(S.relics.includes('coin')) addToHand(G.p,COIN);
  if(S.relics.includes('enemy')&&G.a.hand.length) G.a.hand.pop();
  setScreen('battle'); updateScore();
  showMulligan();

function newSide(defs){
  return {hero:MAX_HP,armor:0,mana:0,max:0,extraMana:0,spellBonus:0,powerUsed:false,
    deck:shuffle(defs.map(inst)),hand:[],board:[],fatigue:0};
}
function draw(s,n){
  for(let k=0;k<n;k++){
    if(!s.deck.length){ s.fatigue++; s.hero-=s.fatigue; continue; }
    const c=s.deck.pop();
    if(s.hand.length<handLimit(s)) s.hand.push(c);
    else if(s===G.p) G.note='Карта сгорела: в руке уже 10 карт';
  }
}
function handLimit(s){ return MAX_HAND+(G&&s===G.p&&S.relics.includes('bag')?2:0); }
function addToHand(s,c){ if(s.hand.length<handLimit(s)) s.hand.push(inst(c)); }

// Мана: +1 за ход до 10, полностью восполняется. Атаки восстанавливаются.
// Замороженное существо пропускает ближайшую атаку.
function beginTurn(s,skipDraw){
  s.max=Math.min(MAX_MANA,s.max+1);
  s.mana=s.max+(s.extraMana||0); s.extraMana=0;
  s.powerUses=0;
  if(s===G.p){ if(S.relics.includes('plate')) s.armor=(s.armor||0)+1; if(S.relics.includes('rest')) heal(s,1); }
  let thawed=false;
  s.board.forEach(m=>{
    if(m.frozen){ m.atks=0; m.frozen=false; thawed=true; } else m.atks=m.windfury?2:1;
    m.noHero=false;
  });
  if(thawed&&s===G.p) sfx('thaw');
  if(!skipDraw) draw(s,1);
}
// Призыв: существо без Рывка и Натиска ждёт один ход.
function placeMinion(s,c){
  c.atks=(c.charge||c.rush)?(c.windfury?2:1):0;
  c.noHero=!!c.rush&&!c.charge;
  if(G&&s===G.p){ if(S.relics.includes('forge')) buff(c,0,1,'Кузнечный молот'); if(S.relics.includes('obruch')) buff(c,1,0,'Стальной обруч'); }
  s.board.push(c);
  sfx('summon',c.tag);
}
// Бонус существа: меняет текущие характеристики и запоминает источник (copy-on-write, шаблоны не меняются)
function buff(m,da,dh,label){
  m.atk+=da; m.hp+=dh;
  const list=(m.buffs||[]).map(x=>({...x}));
  const b=list.find(x=>x.label===label);
  if(b){ b.da+=da; b.dh+=dh; } else list.push({da,dh,label});
  m.buffs=list;
}
// Синергия: если на поле уже есть существо той же темы, новое получает +1/+1
function synergy(s,c){
  if(c.tag&&s.board.some(m=>m.tag===c.tag)){ buff(c,1,1,'Синергия'); }
}
function hurt(m,n){
  if(n<=0) return;
  if(m.divine){ m.divine=false; return; }
  m.hp-=n;
  if(m.enrage&&m.hp>0) buff(m,2,0,'Ярость');
}
function heal(side,n){ side.hero=Math.min(MAX_HP,side.hero+n); }
// Урон герою сначала снимает броню
function dealHero(side,n){
  if(n<=0) return;
  const a=Math.min(side.armor||0,n);
  side.armor=(side.armor||0)-a;
  side.hero-=(n-a);
}
function silence(m){
  m.taunt=m.charge=m.rush=m.divine=m.windfury=m.stealth=m.lifesteal=m.reborn=m.enrage=false;
  m.bc=null; m.dr=null; m.noHero=false; m.thorns=0;
}
function hasKw(m){ return m.taunt||m.charge||m.rush||m.divine||m.windfury||m.stealth||m.lifesteal||m.reborn||m.enrage||!!m.thorns||!!m.bc||!!m.dr; }
// Обмен ударами: урон считается по атаке до ответа; вампиризм лечит владельца; шипы бьют атакующего
function combat(x,y,own){
  const xa=x.atk, ya=y.atk;
  hurt(y,xa); hurt(x,ya);
  if(x.lifesteal&&own) heal(own,xa);
  if(y.thorns) hurt(x,y.thorns);
}

function castSpell(side,other,c,t,src){
  const lbl=src||c.name||'Эффект';
  const bonus=(!c.power&&['dmg','aoe','wdmg'].includes(c.eff))?(side.spellBonus||0):0;
  const v=c.val+bonus;
  switch(c.eff){
    case 'dmg': if(t==='hero') dealHero(other,v); else hurt(t,v); break;
    case 'buff': buff(t,v,v,lbl); break;
    case 'silence': silence(t); break;
    case 'heal': heal(side,v); break;
    case 'draw': draw(side,v); break;
    case 'aoe': other.board.forEach(m=>hurt(m,v)); break;
    case 'hitHero': dealHero(other,v); break;
    case 'buffAll': side.board.forEach(m=>buff(m,v,v,lbl)); break;
    case 'coin': side.mana+=v; break;
    case 'kill': if(t&&t!=='hero') t.hp=0; break;
    case 'mheal': if(t&&t!=='hero') buff(t,0,v,lbl); break;
    case 'self': if(t&&t!=='hero') buff(t,v,v,lbl); break;
    case 'wdmg': {
      const cands=other.board.filter(m=>!m.stealth);
      if(!cands.length) dealHero(other,v);
      else hurt(cands.reduce((a,b)=>b.hp<a.hp?b:a),v);
      break;
    }
    case 'summon': if(c.tok&&side.board.length<MAX_BOARD) placeMinion(side,inst(c.tok)); break;
    case 'ramp': side.max=Math.min(MAX_MANA,side.max+c.val); break;
    case 'drawHit': draw(side,1); dealHero(other,c.val); break;
    case 'freeze': if(t&&t!=='hero'){ t.frozen=true; sfx('freeze'); } break;
    case 'freezeAll': other.board.forEach(m=>{ m.frozen=true; }); sfx('freeze'); break;
    case 'armor': side.armor=(side.armor||0)+c.val; break;
  }
}
// Смерть существ, предсмертные хрипы и возрождение; повторяем, пока есть погибшие.
function settle(){
  for(let guard=0;guard<30;guard++){
    const deaths=[];
    for(const s of [G.p,G.a]){
      const d=s.board.filter(m=>m.hp<=0);
      if(d.length){ s.board=s.board.filter(m=>m.hp>0); deaths.push([s,d]); }
    }
    if(!deaths.length) break;
    for(const [s,d] of deaths){
      const o=s===G.p?G.a:G.p;
      for(const m of d){
        shatter(m,s===G.p?'p':'a');
        if(m.dr) castSpell(s,o,m.dr,null,m.name);
        if(m.reborn&&s.board.length<MAX_BOARD){
          placeMinion(s,{...m,uid:uid++,atk:m.baseAtk??m.atk,hp:1,baseHp:m.baseHp??m.hp,buffs:[],reborn:false,atks:0});
        }
      }
    }
  }
}
async function runEffect(side,other,fx,t=null,src=null){
  if(!fx) return;
  if(fx.eff==='discover'){ await discover(side); return; }
  castSpell(side,other,fx,t,src);
}
async function discover(side){
  const opts=genOpts();
  const choice=side===G.a?opts[rnd(3)]:await showDiscover(opts);
  addToHand(side,choice);
}
function showDiscover(opts){
  return new Promise(res=>{
    const box=$('#dOpts'); box.innerHTML='';
    opts.forEach(c=>{
      const el=cardEl(c);
      el.onclick=()=>{ $('#discover').classList.remove('show'); res(c); };
      box.appendChild(el);
    });
    $('#discover').classList.add('show');
  });
}

    const b=document.createElement('i'); b.className='bit';
    b.style.left=rnd(100)+'%';

    b.style.animationDelay=(rnd(60)/100)+'s';
    b.style.animationDuration=(1.2+rnd(80)/100)+'s';

function quake(){
  const el=$('#screen');
  el.classList.remove('quake'); void el.offsetWidth; el.classList.add('quake');
}
function checkOver(){
  if(G.over) return true;
  if(G.p.hero<=0||G.a.hero<=0){
    G.over=true;
    const won=G.p.hero>0;
    if(won) S.wins++; else S.losses++;
    S.gold=(S.gold||0)+(won?3:1)+(won&&S.relics.includes('gold')?2:0);
    if(won&&G.elite){ D.picks.push(randomRare()); D.size=D.picks.length; }
    const done=S.wins>=WIN_GOAL||S.losses>=LOSS_LIMIT;
    S.pending=won&&!done;
    $('#res').textContent=done?(S.wins>=WIN_GOAL?'СЕРИЯ ВЫИГРАНА!':'СЕРИЯ ОКОНЧЕНА'):(won?'ПОБЕДА':'ПОРАЖЕНИЕ');
    $('#sub').textContent=`Счёт серии ${S.wins} : ${S.losses} · золото ${S.gold}`;
    $('#next').style.display=done?'none':'';
    $('#next').textContent=S.pending?'НАГРАДА':'СЛЕДУЮЩИЙ МАТЧ';
    $('#again').textContent=done?'НОВАЯ АРЕНА':'В МЕНЮ';
    updateScore();
    document.querySelectorAll('#overlay .bit').forEach(b=>b.remove());
    $('#overlay').classList.add('show');
    if(done) clearSave(); else persist('between');
    if(won){ sfx(done&&S.wins>=WIN_GOAL?'win':'win'); confetti(done&&S.wins>=WIN_GOAL?80:36); }
    else { sfx('lose'); quake(); }
    return true;
  }
  return false;
}
function showRelicPick(done=afterReward){
  const left=RELIC_IDS.filter(id=>!S.relics.includes(id));
  if(!left.length){ S.pending=false; return done(); }
  PHASE='relic';
  const list=$('#relicList'); list.innerHTML='';
  shuffle(left).slice(0,3).forEach(id=>{
    const b=document.createElement('button');
    b.className='pbtn relicBtn ghost';
    b.innerHTML=`${RELICS[id].name}<small>${RELICS[id].desc}</small>`;
    b.onclick=()=>{
      sfx('relic');
      S.relics.push(id); S.pending=false;
      $('#relic').classList.remove('show');
      persist('between');
      done();
    };
    list.appendChild(b);
  });
  $('#overlay').classList.remove('show');
  $('#relic').classList.add('show');
}
const RELIC_IDS=Object.keys(RELICS);
$('#next').onclick=()=>{ sfx('click'); if(S.pending) showRelicPick(); else afterReward(); };
$('#again').onclick=()=>{ sfx('click'); newArena(); };
$('#quit').onclick=()=>{ sfx('click'); ask('Прервать серию и вернуться в меню?','ПРЕРВАТЬ',()=>{ clearSave(); newArena(); }); };

/* ---------- Путь серии: узлы, золото, лавка, личности ИИ, боссы ---------- */
const NODES={
  fight:{name:'БОЙ',desc:'Обычный соперник'},
  shop:{name:'ЛАВКА',desc:'Купить карту за золото'},
  trader:{name:'ТОРГОВЕЦ',desc:'Отдать карту и получить реликвию'},
  smith:{name:'КУЗНЕЦ',desc:'+1/+1 существу из колоды'},
  shrine:{name:'ОАЗИС',desc:'Убрать одну карту из колоды'},
  gamble:{name:'ИСПЫТАНИЕ',desc:'Пятьдесят на пятьдесят: редкая карта или потеря'},
  rest:{name:'ОТДЫХ',desc:'+3 брони в следующем бою'},
  elite:{name:'ЭЛИТА',desc:'Сильнее соперник, за победу редкая карта'},
  boss:{name:'БОСС',desc:'У всех существ соперника шипы'},
};
const PRICE={common:2,rare:3,myth:4,leg:5};
/* Личности соперника: что он предпочитает в колоде */
const PERS=[
  {name:'Налётчик',pref:c=>c.type==='minion'&&(c.charge||c.rush||c.windfury||c.atk>=3)},
  {name:'Страж',pref:c=>c.type==='minion'&&(c.taunt||c.divine||c.hp>=4)},
  {name:'Книжник',pref:c=>c.type==='spell'},
];
function randomRare(){
  const pool=[...BY_R.rare,...BY_R.myth,...BY_R.leg];
  return clone(pool[rnd(pool.length)]);
}
function canThin(){ return D.picks.length>10; }
function removeDeckCard(i){ D.picks.splice(i,1); D.size=D.picks.length; }
function afterReward(){ S.route=makeRoute(); showRoute(); }
/* Между боями — три узла (оазис всегда в списке); каждый пятый бой — босс */
function makeRoute(){
  const n=S.wins+S.losses+1;
  if(n%5===0) return ['boss'];
  const pool=['fight','shop','trader','smith','gamble','rest','elite'];
  return shuffle([...shuffle(pool).slice(0,2),'shrine']);
}
function showRoute(){
  PHASE='route'; setScreen('draft');
  if(!S.route) S.route=makeRoute();
  $('#status').textContent='Путь';
  updateRoad();
  persist('route');
  const boss=S.route.length===1&&S.route[0]==='boss';
  $('#screen').innerHTML=`
    <h2>${boss?'Впереди босс':'Выберите путь'}</h2>
    <div class="sub">Бой ${S.wins+S.losses+1} · золото ${S.gold||0} · победы ${S.wins}/${WIN_GOAL}</div>
    <div class="modes" id="nodes"></div>`;
  S.route.forEach(id=>{
    const b=document.createElement('button');
    b.className='pbtn big ghost';
    b.innerHTML=`${NODES[id].name}<small>${NODES[id].desc}</small>`;
    b.onclick=()=>{ sfx('click'); chooseNode(id); };
    $('#nodes').appendChild(b);
  });
}
function chooseNode(id){
  if(id==='fight'||id==='boss') return startMatch();
  if(id==='rest'){ S.nextArmor=3; return startMatch(); }
  if(id==='elite'){ S.elite=true; return startMatch(); }
  if(id==='shop') return showShop();
  if(id==='trader'){
    if(!canThin()) return showNote('ТОРГОВЕЦ','Колода слишком мала для обмена.','ДАЛЬШЕ',startMatch);
    return showPickDeck('ТОРГОВЕЦ','Отдайте карту. Взамен получите реликвию.',()=>true,i=>{ removeDeckCard(i); showRelicPick(startMatch); });
  }
  if(id==='smith'){
    if(!D.picks.some(c=>c.type==='minion')) return showNote('КУЗНЕЦ','В колоде нет существ.','ДАЛЬШЕ',startMatch);
    return showPickDeck('КУЗНЕЦ','Выберите существо: оно получит +1/+1.',c=>c.type==='minion',i=>{ buff(D.picks[i],1,1,'Кузнец'); startMatch(); });
  }
  if(id==='shrine'){
    if(!canThin()) return showNote('ОАЗИС','Колода уже минимальна.','ДАЛЬШЕ',startMatch);
    return showPickDeck('ОАЗИС','Уберите одну карту из колоды.',()=>true,i=>{ removeDeckCard(i); startMatch(); });
  }
  if(id==='gamble'){
    if(rnd(2)===0){
      const c=randomRare(); D.picks.push(c); D.size=D.picks.length;
      return showNote('ИСПЫТАНИЕ',`Удача! В колоду добавлена «${c.name}».`,'ДАЛЬШЕ',startMatch);
    }
    if(canThin()){
      const i=rnd(D.picks.length), name=D.picks[i].name; removeDeckCard(i);
      return showNote('ИСПЫТАНИЕ',`Неудача. Карта «${name}» потеряна.`,'ДАЛЬШЕ',startMatch);
    }
    return showNote('ИСПЫТАНИЕ','Неудача, но в такой колоде терять нечего.','ДАЛЬШЕ',startMatch);
  }
}

/* ---------- Сила героя ---------- */
function powerCost(){ return Math.max(1,POWERS[S.power].cost-(S.relics.includes('power')?1:0)); }
function powerLimit(){ return 1+(S.relics.includes('twice')?1:0); }
function canUsePower(){
  return !!G&&G.turn==='p'&&!G.busy&&!G.over&&!G.pend&&(G.p.powerUses||0)<powerLimit()&&G.p.mana>=powerCost();
}
function usePower(){
  if(!canUsePower()) return;
  if(POWERS[S.power].target){ G.powerSel=true; G.sel=null; G.atk=null; return render(); }
  applyPower(null);
}
function applyPower(t){
  const P=POWERS[S.power];
  G.p.mana-=powerCost(); G.p.powerUses=(G.p.powerUses||0)+1; G.powerSel=false;
  sfx('power');
  switch(S.power){
    case 'guard': if(G.p.board.length<MAX_BOARD) placeMinion(G.p,inst(TK('Страж',1,2,'shield',1))); break;
    case 'call': if(G.p.board.length<MAX_BOARD) placeMinion(G.p,inst(TK('Всадник',2,1,'horse',1,'c'))); break;
    case 'heal': heal(G.p,3); break;
    case 'shield': G.p.armor=(G.p.armor||0)+2; break;
    case 'fire': dealHero(G.a,2); break;
    case 'drain': dealHero(G.a,2); heal(G.p,2); break;
    case 'storm': G.a.board.slice().forEach(m=>hurt(m,1)); break;
    case 'draw': draw(G.p,1); break;
    case 'draw2': draw(G.p,2); break;
    case 'coin': G.p.mana+=1; break;
    case 'gain': G.p.max=Math.min(MAX_MANA,G.p.max+1); break;
    default: if(P.target&&t) castSpell(G.p,G.a,{eff:P.eff,val:P.val,power:true,name:P.name},t);
  }
  settle(); checkOver(); render();
}

function showMulligan(){

  $('#screen').innerHTML=`
    <div id="tipBox"><div id="tipText"></div><div class="row"><button class="pbtn sm" id="tipNext">ДАЛЬШЕ</button><button class="pbtn sm ghost" id="tipSkip">ПРОПУСТИТЬ</button></div></div>
    <h2>Муллиган</h2>
    <div class="sub">${G.first==='p'
      ? 'Вы ходите первым: 3 карты.'
      : 'Вы ходите вторым: 4 карты и Монетка (+1 мана на ход).'}<br>
      Нажмите карты, которые хотите заменить.</div>
    <div class="draftRow${G.p.hand.length%2===0?' quad':''}" id="mull"></div>
    <div class="row" style="margin-top:16px"><button class="pbtn" id="keep">ОСТАВИТЬ</button></div>`;
  renderMull();
  $('#keep').onclick=finishMulligan;
  bindTip();
  renderTip();
}
/* Карты создаются один раз; при выборе меняется только класс, поэтому анимация появления не повторяется */
function renderMull(){
  const box=$('#mull');
  if(!box.children.length){
    G.p.hand.forEach((c,i)=>{
      const el=cardEl(c);
      el.onclick=()=>{ G.mull.has(i)?G.mull.delete(i):G.mull.add(i); el.classList.toggle('repl',G.mull.has(i)); };
      box.appendChild(el);
    });
  }
  [...box.children].forEach((el,i)=>el.classList.toggle('repl',G.mull.has(i)));
}
function swapCards(s,idxs){
  if(!idxs.length) return;
  const out=idxs.map(i=>s.hand[i]);
  s.hand=s.hand.filter((_,i)=>!idxs.includes(i));
  s.deck.push(...out);
  shuffle(s.deck);
  draw(s,idxs.length);
}
function finishMulligan(){
  sfx('click');
  swapCards(G.p,[...G.mull]);
  swapCards(G.a,G.a.hand.map((c,i)=>c.cost>=4?i:-1).filter(i=>i>=0));
  G.mull=new Set();
  addToHand(G[G.coinFor],COIN);
  if(S.relics.includes('draw')) draw(G.p,1);
  if(G.first==='p'){
    beginTurn(G.p,true);
    showBattle();
  } else {
    showBattle();
    aiTurn(true);
  }
}

/* ---------- Обучение: подсказки по шагам ---------- */
function bindTip(){
  const nx=$('#tipNext'), sk=$('#tipSkip');
  if(nx) nx.onclick=()=>{ sfx('click'); TUT.step++; if(TUT.step>=TUT_STEPS.length) endTutorial(); else { renderTip(); saveTut(); } };
  if(sk) sk.onclick=()=>{ sfx('click'); endTutorial(); };
}
function renderTip(){
  const b=$('#tipBox'), t=$('#tipText');
  if(!b||!t) return;
  if(!TUT.on){ b.classList.remove('show'); return; }
  b.classList.add('show');
  t.textContent=`${TUT.step+1}/${TUT_STEPS.length}. ${TUT_STEPS[TUT.step]}`;
}
function saveTut(){ if(D&&G&&!G.over&&(PHASE==='battle'||PHASE==='mull')) persist(PHASE); }
function endTutorial(){
  TUT={on:false,step:0};
  saveTut();
  SET.tutDone=true; saveSet();
  const b=$('#tipBox'); if(b) b.classList.remove('show');
}

function boardEl(m,side,cls){
  const el=cardEl(m,{v:'board',cls});
  if(!seen.has(m.uid)){ seen.add(m.uid); el.classList.add('enter'); el.dataset.tag=m.tag||''; pendingBeams.push(el); }
  if(G.lunge===m.uid) el.classList.add('lunge');
  el.onclick=()=>{ if(handDragged){ handDragged=false; return; } onTarget(side,m); };
  if(side==='p') bindBoardMinion(el,m);
  return el;
}

function render(){
  if(!G) return;
  const p=G.p,a=G.a;
  const pTurn=G.turn==='p'&&!G.busy&&!G.over;
  const taunts=a.board.some(m=>m.taunt);
  const attacker=G.atk!=null?p.board.find(m=>m.uid===G.atk):null;
  const selCard=G.sel!==null?p.hand[G.sel]:(G.pend?G.pend.card:null);
  const eff=G.powerSel?POWERS[S.power].eff:(selCard?selCard.eff:null);
  const aiming=!!selCard||G.powerSel;
  const canAttackHero=!!attacker&&!taunts&&!attacker.noHero;

  const heroHit=pTurn&&((aiming&&canTarget(eff,'a','hero'))||(!aiming&&canAttackHero));
  $('#aCard').className='heroCard px'+(heroHit?' target':'');
  $('#aCard').onclick=()=>onTarget('a','hero');
  $('#aHP').textContent=a.hero; $('#pHP').textContent=p.hero;
  $('#aAR').textContent=a.armor||0; $('#pAR').textContent=p.armor||0;
  $('#aAR').className='oar'+(armorCrack.a?' oar-crack':'')+((a.armor||0)===0?' oar-empty':'');
  $('#pAR').className='oar'+(armorCrack.p?' oar-crack':'')+((p.armor||0)===0?' oar-empty':'');
  $('#aSegs').innerHTML=Array.from({length:MAX_HP},(_,i)=>`<i class="${i<a.hero?'on':''}"></i>`).join('');
  $('#pSegs').innerHTML=Array.from({length:MAX_HP},(_,i)=>`<i class="${i<p.hero?'on':''}"></i>`).join('');
  $('#aHero').innerHTML=`ИИ<br>рука ${a.hand.length} · колода ${a.deck.length}`;
  $('#pHero').innerHTML=`ВЫ<br>колода <b class="dn${prevDeck.p!==null&&prevDeck.p!==p.deck.length?' bump':''}" id="pDeckN">${p.deck.length}</b>`;
  prevDeck={p:p.deck.length,a:a.deck.length};
  const mw=$('#mana');
  while(mw.children.length<p.max) mw.appendChild(document.createElement('i'));
  while(mw.children.length>p.max) mw.lastChild.remove();
  const canSpend=pTurn&&p.hand.some(c=>c.cost<=p.mana);
  [...mw.children].forEach((cr,i)=>{
    const on=i<p.mana;
    const gained=on&&i>=prevMana;
    cr.className='cr'+(on?' on':'')+(gained?' cr-fill':'')+(on&&canSpend&&!gained?' cr-blink':'');
  });
  prevMana=p.mana;

  const pw=$('#power');
  if(pw){
    pw.innerHTML=G.powerSel?'ОТМЕНА':`${POWERS[S.power].name}<br>${(p.powerUses||0)>=powerLimit()?'исп.':powerCost()+' ман.'}`;
    pw.disabled=!G.powerSel&&!canUsePower();
  }

  const aB=$('#aBoard'); aB.innerHTML='';
  a.board.forEach(m=>{
    const hit=pTurn&&(aiming?canTarget(eff,'a',m):(!!attacker&&!m.stealth&&(!taunts||m.taunt)));
    aB.appendChild(boardEl(m,'a',hit?'target':''));
  });

  const pB=$('#pBoard'); pB.innerHTML='';
  p.board.forEach(m=>{
    let cls='';
    if(G.atk===m.uid) cls='sel';
    else if(pTurn&&selCard&&canTarget(eff,'p',m)) cls='target';
    else if(pTurn&&m.atks>0&&m.atk>0) cls='ready';
    pB.appendChild(boardEl(m,'p',cls));
  });

  const hand=$('#pHand'); hand.innerHTML='';
  const newHand=[];
  p.hand.forEach((c,i)=>{
    const cls=[(c.cost>p.mana||!pTurn)?'dim':'',G.sel===i?'sel':''].join(' ');
    const el=cardEl(c,{v:'hand',cls});
    if(!seen.has(c.uid)){ seen.add(c.uid); newHand.push(el); }
    bindHandCard(el,i);
    hand.appendChild(el);
  });
  dealArc(newHand);
  const cnt=$('#counts');
  if(cnt) cnt.innerHTML=`МАНА <b>${p.mana}/${p.max}</b><br>РУКА <b class="${p.hand.length>=handLimit(p)?'full':''}">${p.hand.length}/${handLimit(p)}</b>`;

  let txt;
  if(G.over) txt='';
  else if(G.turn==='a') txt='Ход противника…';
  else if(G.busy) txt='Выберите карту';
  else if(G.pend) txt='Выберите цель · нажмите подсказку, чтобы отменить';
  else if(G.powerSel) txt='Выберите цель для Стрелы';
  else if(G.sel!==null) txt='Выберите цель приёма';
  else if(G.atk!=null) txt='Выберите цель для атаки';
  else txt='Тяните карту из руки на поле';
  $('#hint').textContent=(G.note?G.note+'. ':'')+txt;
  $('#end').disabled=!pTurn||!!G.pend;

  if(prevTurn!==G.turn){
    prevTurn=G.turn;
    if(!G.over) banner(G.turn==='p'?'ВАШ ХОД':'ХОД ПРОТИВНИКА');
  }
  pendingBeams.splice(0).forEach(beamAt);
  animateDiffs();
  G.lunge=null;
  if(PHASE==='battle'&&!G.busy&&!G.over&&G.turn==='p') persist('battle');
}

/* ---------- Анимации боя (v4) ---------- */
const TAG_FX={fortress:'#ffc857',desert:'#ff8a3d',gardens:'#5fd38d'};
const pendingBeams=[];
let prevTurn=null, prevMana=0;
let prevDeck={p:null,a:null}, prevArmor={p:null,a:null}, armorCrack={p:false,a:false};
const spd=()=>SPEEDS[SET.speed]||1;
/* Пиксельная стрела летит от атакующего к цели; промис завершается в момент попадания */
function flyTo(fromEl,toEl,color){
  return new Promise(res=>{
    if(!fromEl||!toEl) return res();
    const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
    const ax=a.left+a.width/2, ay=a.top+a.height/2, bx=b.left+b.width/2, by=b.top+b.height/2;
    const cv=document.createElement('canvas'); cv.width=12; cv.height=4; cv.className='proj';
    const g=cv.getContext('2d'); g.fillStyle=color||'#ffc857';
    g.fillRect(0,1,8,2); g.fillRect(8,0,2,4); g.fillRect(10,1,2,2);
    const ang=Math.atan2(by-ay,bx-ax), dist=Math.hypot(bx-ax,by-ay);
    document.body.appendChild(cv);
    const an=cv.animate([
      {transform:`translate(${ax-12}px,${ay-4}px) rotate(${ang}rad)`},
      {transform:`translate(${bx-12}px,${by-4}px) rotate(${ang}rad)`}
    ],{duration:Math.max(160,Math.min(340,dist*0.6))*spd(),easing:'ease-in',fill:'forwards'});
    an.onfinish=()=>{ cv.remove(); res(); };
  });
}
/* Мёртвое существо рассыпается на пиксели */
function shatter(m,side){
  const el=document.querySelector(`#${side==='p'?'pBoard':'aBoard'} [data-uid="${m.uid}"]`);
  if(!el) return;
  const r=el.getBoundingClientRect();
  const g=el.cloneNode(true);
  g.classList.remove('enter','lunge','shake','hitflash','sel','target','ready','frz','deal');
  g.classList.add('ghostCard');
  Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  const src=el.querySelector('canvas'), dst=g.querySelector('canvas');
  if(src&&dst) dst.getContext('2d').drawImage(src,0,0,dst.width,dst.height);
  document.body.appendChild(g);
  setTimeout(()=>g.remove(),700*spd());
  const col=RCOL[m.rar]||'#f4f0ff';
  for(let i=0;i<12;i++){
    const sh=document.createElement('i'); sh.className='shard';
    sh.style.left=(r.left+Math.random()*r.width)+'px';
    sh.style.top=(r.top+Math.random()*r.height)+'px';
    sh.style.background=Math.random()<.5?col:'#c9a96a';
    sh.style.setProperty('--sx',((Math.random()-.5)*90).toFixed(0)+'px');
    sh.style.setProperty('--sy',(20+Math.random()*60).toFixed(0)+'px');
    document.body.appendChild(sh);
    setTimeout(()=>sh.remove(),800*spd());

}
/* Световой столб над новым существом */
function beamAt(el){

/* Заклинание вспыхивает цветом своей темы */
function spellFx(tag){

/* Баннер хода: полоса проезжает по экрану */
function banner(text){

/* Карты, пришедшие в руку, вылетают из колоды по дуге */
function dealArc(els){
  const dn=$('#pDeckN'); if(!dn||!els.length) return;
  const d=dn.getBoundingClientRect(), x0=d.left+d.width/2, y0=d.top+d.height/2;

/* Счётчик побед — путь из 13 клеток, поражения — фонарики */
function updateRoad(){
  const cells=Array.from({length:WIN_GOAL},(_,i)=>`<i class="rd${i<S.wins?' won':i===S.wins?' cur':''}"></i>`).join('');
  const lamps=Array.from({length:LOSS_LIMIT},(_,i)=>`<i class="lamp${i<LOSS_LIMIT-S.losses?'':' off'}"></i>`).join('');
